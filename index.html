my\nCompetence\nRelatedness\nSelf-Determination Theory\nSDT", "abstract": "The rapid diffusion of Artificial Intelligence (AI) is transforming everyday practices, raising concerns about emerging forms of excessive use and technological dependency. The present study, based on an online questionnaire with 306 participants aged 18–30, examined how the satisfaction of psychological needs relates to AI dependency. Drawing on Self-Determination Theory (SDT), need satisfaction was assessed both in everyday life and in the context of AI use, alongside a measure of AI dependency. Relationships among variables were examined using Structural Equation Modelling (SEM). Results revealed a contrasting pattern: basic psychological need satisfaction was negatively associated with AI dependency, whereas AI-specific need satisfaction showed a strong positive association. These findings suggest that generative AI may function not only as a compensatory resource for unmet needs, but also as a primary context for need satisfaction, thereby reinforcing dependency-related patterns of use. Contrary to expectations, the association between basic and AI-specific needs was weak, indicating that the two constructs operate as partially independent processes. Overall, the findings highlight the importance of distinguishing between basic and context-specific need satisfaction in understanding the psychological mechanisms underlying AI dependency."}, {"id": 52, "type": "long", "title": "Externalization by Design: Cognitive Load, Bounded AI, and Process-Level Accountability in Expert Knowledge Systems", "authors": "Iren Irbe", "keywords": "tacit knowledge externalization\ncognitive load theory\nEASCI\ngenerative AI governance\ncognitive forcing functions\nprocess-level explainability\nknowledge management\nhuman-AI collaboration", "abstract": "The externalization of tacit knowledge often fails for two primary reasons. First, practitioners are required to recall, organize, and present expert reasoning concurrently, which can overload working memory. Second, in the absence of clear procedural rules, generative AI may generate content that appears reliable but lacks adequate validation, source attribution, or systematic review. This paper introduces EASCI (Experience, Articulation, Structuring, Consolidation, Innovation), a five-stage framework that separates cognitive tasks and restricts AI involvement. To mitigate working-memory overload, the framework employs stage separation, uses multiple information-capture modalities, and incorporates a counter-hypothesis step. Seven design principles, five constraints, a process-level explainability layer, and eleven feedback paths collectively ensure that AI outputs do not acquire authority without human review, thereby enabling process-level auditability. The framework was developed through a design science research methodology, including a scoping review, practitioner interviews, and participatory workshops. Its structure has been formally verified using Lean 4, and quantitative evaluation is ongoing."}, {"id": 23, "type": "long", "title": "Moral Framing of Military Artificial Intelligence: The Role of Trust and Attitudes in Defensive and Offensive Use", "authors": "Oronzo Parlangeli, Antonio Brancati, Giorgia Callori,\nMatteo Chiasso, Leonardo Feroci, Arianna Fiorito, Francesca\nMambrini, Michele Pio Piscopo and Francesco Currò", "keywords": "AI\nmilitary AI\ntrust\ncognitive Attitudes\naffective attitudes\nintelligence perception\nhalo effect\nethical implications\npersonality traits\nIWAH\ndark patterns", "abstract": "Despite growing research on public perceptions of Artificial Intelligence (AI), limited attention has been paid to how moral framing shapes evaluations of military AI. Drawing on research on trust in AI and the halo effect, this study examines whether offensive versus defensive framing influences users’ perceptions across multiple dimensions, including cognitive attitudes, affective attitudes, and perceived intelligence. The study employed an online questionnaire with a between-subjects design. Participants were randomly assigned to one of two conditions, in which they were presented with a scenario describing the development of an AI algorithm for either defensive or offensive military purposes. Results showed that, compared to defensive framing, offensive framing significantly reduced both cognitive and affective attitudes toward the AI system, as well as its perceived intelligence. Trust in AI emerged as a strong and independent predictor across outcomes. Structural equation modeling indicated that the effect of framing on perceived intelligence was largely mediated by affective and cognitive attitudes, consistent with a halo-like process in which moral evaluations shape competence judgments. No moderating effects of identification with all humanity were observed; personality traits were not significant predictors of attitudinal evaluations. However, identification with all humanity showed a significant negative association with affective attitudes. These findings suggest that the perceived intelligence of military AI does not reflect an independent assessment of system capability, but emerges from cognitive, affective and moral evaluations triggered by its intended use. More broadly, they highlight how relatively subtle differences in framing can systematically influence public perceptions, raising concerns about the potential use of defensive narratives as persuasive devices in the communication of military AI. This study contributes to HCI by showing that AI evaluations are not only context-dependent but also morally constructed, with important implications for the design, communication, and governance of AI in high-stakes domains."}, {"id": 40, "type": "long", "title": "Safeguarding Human Potential in Automated Work Systems: A Capability-Centred Framework for Design and Evaluation", "authors": "Lisa Diamond and Michael Oppermann", "keywords": "human-automation interaction\ncapability sustainability\ncognitive ergonomics\nwork design\nhuman-centred AI", "abstract": "Automation and AI increasingly reshape work systems beyond task execution, influencing how human capabilities are used, preserved, or transformed. Cognitive ergonomics traditionally evaluates automation through constructs such as workload, situation awareness, trust, and function allocation. While these perspectives explain important aspects of performance and interaction quality, they do not provide an integrated lens for evaluating how automation shapes human capabilities over time. This paper introduces the Human Potential in Automation (HPA) framework, a capability-centred evaluative framework that integrates perspectives from cognitive ergonomics, work design, and human-centred AI through four dimensions: Optimisation, Retention, Expansion, and Engagement. To operationalise the framework, we introduce a lightweight tool (“action cards”) to support participatory design reflection, and propose a concise 12-item companion scale to enable systematic evaluation of capability outcomes. We illustrate the framework through an exploratory multi-case study involving four industrial stakeholders in AI-supported quality control. The findings demonstrate the practical utility of the framework for identifying capability-related design considerations that extend beyond traditional performance-focused evaluation, contributing an integrative capability-centred perspective for the design and evaluation of automated work systems."}]}}]}, {"start": "15:30", "end": "17:00", "tracks": [{"title": "General Assembly", "kind": "event"}]}, {"start": "18:00", "end": "19:00", "tracks": [{"title": "Keynote — Harry Witchel (Contrada)", "kind": "keynote"}]}, {"start": "19:00", "end": "19:30", "tracks": [{"title": "Visita contrada", "kind": "event"}]}, {"start": "20:00", "end": "", "tracks": [{"title": "Social dinner", "kind": "event"}]}], "18": [{"start": "09:30", "end": "11:00", "tracks": [{"title": "Explainable Systems, Infrastructure and Evaluation Methods", "kind": "session", "session": {"title": "Explainable Systems, Infrastructure and Evaluation Methods", "papers": [{"id": 13, "type": "long", "title": "Articulation Work and Conventions: The Workers’ Experience", "authors": "Romain Roccamatisi, Nadia Gauducheau and Myriam Lewkowicz", "keywords": "Conventions\nArticulation Work\nQuality of Life at Work\nHybrid Work\nReflexivity\nWorkshops", "abstract": "In cooperative work settings, coordination relies on shared practices known as conventions. These conventions are often implicit, taken for granted, and rarely discussed, despite their central role in organizing distributed work. While early CSCW studies have highlighted their importance, the evolution of digital artifacts and the rise of hybrid work call for renewed attention to how workers perceive them today. This study explores workers’ experiences with conventions in contemporary digital environments through workshops conducted in two organizations. Participants were invited to identify, discuss, and reflect on the conventions shaping their digital collaboration. The findings reveal that conventions are unevenly recognized and shared, remain highly situated, and are continuously renegotiated as new tools and colleagues are introduced. While conventions support articulation work, their lack of explicit recognition and discussion can hinder coordination. This paper contributes to CSCW research by examining current experiences of conventions and demonstrating that making them visible and discussable offers a valuable lens for understanding cooperative work. It also shows that workshop-based approaches can foster reflection on conventions, thereby supporting smoother coordination and improving quality of working life."}, {"id": 34, "type": "long", "title": "deMIT Open Research: A Cognitively Sustainable Infrastructure for Shared Knowledge", "authors": "Simone Giancaspero, Arianna Mazza and Stefano Guidi", "keywords": "Open Science infrastructure\nCognitive sustainability\nHuman-technology cooperation", "abstract": "This paper presents deMIT Open Research, an exploratory project developing a digital infrastructure for knowledge sharing within the National Doctoral Programme in Design for Made in Italy. Addressing the fragmentation of research production across a dispersed community, the initiative combines co-design and action research across four phases: co-creation, keyword normalisation, prototyping of an interactive R/Shiny web application, and ongoing integration with the institutional platform ATENA. The resulting tool makes thematic affinities among doctoral projects visible through keyword-based network visualisation, supporting community-building and sustainable open research practices."}, {"id": 21, "type": "long", "title": "Do Hedonic Aspects of Context Bias UX Evaluation? Evidence from Controlled Virtual Environments", "authors": "Rayane Mabrouki, Laetitia Gros, Julian Moreira,\nJean-François Petiot and Franck Mars", "keywords": "User Experience (UX)\nContext of Use\nHedonic Quality\nVirtual Reality (VR)\nHalo Effect", "abstract": "In this article, we propose a novel conceptual dichotomy to characterize the effects of context on User eXperience (UX), distinguishing between pragmatic and hedonic qualities of context. Pragmatic qualities refer to aspects of the interaction environment that affect UX through the alteration of users’ ability to act, whereas hedonic qualities shape the experience by coloring it without directly impacting interaction capabilities. Focusing on the latter, which remain comparatively underexplored, we investigate the influence of the hedonic qualities of the physical context on UX evaluation. To this end, we developed a dedicated questionnaire, the Hedonic Qualities of Context Scale (HQCS), and designed immersive virtual environments varying along these qualities. We conducted two controlled user studies in which participants interacted with a TV service within these environments. While the environments elicited significantly different evaluations in terms of hedonic qualities, no differences were observed in UX evaluation as measured by AttrakDiff. Similarly, no variation in emotional state was found across conditions using the Self-Assessment Manikin. Taken together, these results suggest that hedonic qualities of context do not directly influence UX evaluation in the absence of changes in users’ internal state. More broadly, they support the interpretation that context impacts product perception only insofar as it alters the user's internal state, and highlight the role of potential moderating factors—such as attentional engagement—in the manifestation of contextual effects."}]}, "track": "A"}, {"title": "Physiological and Behavioural Measurement Methods", "kind": "session", "session": {"title": "Physiological and Behavioural Measurement Methods", "papers": [{"id": 38, "type": "wip", "title": "Toward an Eye-Tracking Adaptive Interface for Interactive Evolutionary Computation", "authors": "Anais Tracoulat, Teresa Colombi, Denis Pallez, Nolwenn\nGauer, Ambre Mounié, Marie Waeles-Devaux, Gabriel Al-Najjar\nand Arion Haxhui", "keywords": "- interactive evolutionary computation\n- eye tracking\n- adaptive interface\n- cognitive load\n- human-AI interaction", "abstract": "Interactive Evolutionary Computation (IEC) refers to optimization methods in which human evaluations are integrated into the search process. This approach is particularly relevant when the quality of a solution cannot be defined through objective mathematical criteria alone, because it depends on subjective preferences, perceptual judgments, or implicit mental representations. For instance, a user may have a mental representation of an ideal product, such as a piece of clothing or a graphical interface, without being able to explicitly formalize all the criteria defining this preference. However, IEC systems are limited by the number of evaluations that users can perform before cognitive fatigue, attentional overload, or disengagement occur. Traditional evolutionary algorithms often require many evaluations to converge, whereas human users have limited cognitive resources. This creates a central challenge for human-algorithm interaction: supporting algorithmic convergence while preserving acceptable cognitive conditions for the user. This work-in-progress paper presents an experimental protocol comparing a fixed display with an eye-tracking-based adaptive display. The adaptive interface adjusts the number of displayed items according to the user's estimated cognitive state. The study aims to assess whether this adaptation can reduce cognitive load while preserving convergence toward a target item, using measures such as recognition performance, search time, pupil dilation, workload, and number of displayed items."}, {"id": 58, "type": "short", "title": "The Red Shoes 2", "authors": "Rachael E. Hollands, Mimi Porter, Jessica A. Eccles,\nThanaporn Tunprasert and Harry Witchel", "keywords": "ambulation\nmotion capture\nwalking analysis\nred sneakers\ngreen trainers", "abstract": "In this work in progress, we elucidate further progress using a low-tech and frugal design for offline tracking of gait on a treadmill using a single dorsally-situated GoPro video camera recording at 240 fps. Our participants wore brightly coloured athletic shoes (one red, one green) and three LEDs on their back. This method can derive a range of variability measures such as stance time asymmetry and step time variability; these are typically unavailable without a costly gait lab work up. This approach may aid in teasing apart subtle gait changes linked to joint hypermobility and its effects on gait."}, {"id": 51, "type": "long", "title": "Balancing immersion and usability in virtual reality training: Effects on self-efficacy and user experience in mass casualty incident simulation", "authors": "Marie-Helene Ferrer, Marc Magniez, Cedric Basquin,\nGuillaume Mellon and Julien Galant", "keywords": "Human Computer Interaction\nVirtual Reality\nUsability Testing\nHealthcare training\nSelf-efficacy\nUser experience\nPresence\nCognitive load\nSimulation-based learning", "abstract": "Mass casualty incidents (MCIs) are high-risk situations requiring rapid triage, prioritisation, and coordinated decision-making under pressure. Virtual reality (VR) offers new opportunities to design immersive training environments for such contexts, but its effectiveness depends on the balance between immersion, usability, and cognitive demands.\nThis exploratory study investigates how an immersive VR training system (SimTriage) affects self-efficacy, user experience, presence, flow, and cognitive workload. Using a multi-method psychometric framework (SEP MCI, EduFlow2, UEQ, SUS, PSQ, NASA-TLX), data were collected from 20 participants.\nResults show a significant increase in self-efficacy following system interaction (t(19) = −3.31, p = .002, d = 0.74), alongside high levels of presence, cognitive engagement, and positive user experience, while maintaining a moderate cognitive workload. However, substantial inter-individual variability in self-efficacy gains was observed.\nThese findings suggest that training effectiveness in immersive environments depends less on immersion alone than on the alignment between interaction design, usability, and cognitive load. The study contributes to human–computer interaction research by highlighting how experiential and usability factors jointly shape user outcomes in VR-based training systems."}, {"id": 59, "type": "long", "title": "Experimental Verification of Operator Reliability in Standardised Control Panel Operation Using Eye Tracking in Virtual Reality", "authors": "Zdeněk Tůma and Lubos Kotek", "keywords": "Operator reliability\neye tracking\nvirtual reality\ncontrol panel\nhuman error\ncognitive ergonomics", "abstract": "Operator reliability in safety-critical human-machine systems has been studied extensively for conventional manual controls, while hands-free input modalities, in particular gaze-based selection in head-mounted virtual reality, remain underrepresented in quantitative reliability data. Recent industrial training simulators rely on immersive virtual environments to teach operators procedures that would otherwise expose them to hazards, yet the input modality used to confirm panel-level decisions is still typically a hand controller. Eye tracking integrated into the head-mounted display offers a hands-free alternative whose ergonomic and reliability implications, especially for the spatial arrangement of small button arrays, have not been examined under the lens of established human reliability analysis. The study reported here verifies experimentally whether the spatial arrangement of three buttons on a standardised control panel, horizontal versus vertical, influences the operator error rate when the buttons are activated by gaze and dwell selection in immersive virtual reality. The work continues a series of experiments at our institute on human error in virtual reality and on automated ergonomic evaluation of operator workplaces. Twenty participants will complete a balanced sequence of trials in a head-mounted display equipped with binocular eye tracking. On each trial a coloured stimulus appears on the panel and the participant must direct the gaze at the matching button for a fixed dwell period. Target angular size and inter-button spacing follow recommendations from previous gaze-interaction studies. The two panel layouts are presented in counterbalanced order to suppress practice effects. The primary dependent variable is the operator error rate, with errors classified according to the established taxonomy of slips, lapses and mistakes. Secondary measures include the time from stimulus onset to dwell confirmation, the distribution of fixations across the defined areas of interest, and subjective workload reported on the NASA Task Load Index. The error data will be interpreted within the framework of human reliability analysis to derive empirical human error probability values for gaze input in a virtual control panel, allowing comparison with nominal values reported for conventional manual controls. A discussion will address the implications for stimulus-response compatibility, given that the spatial code of the response set differs between the horizontal and the vertical layout. The expected outcome is a quantitative comparison of the two panel layouts in terms of reliability, together with a first set of empirical reference values for human error probability associated with gaze-based input in head-mounted virtual reality. The findings should support evidence-based recommendations for the ergonomic design of gaze-controlled industrial interfaces used in immersive training and remote operation."}]}, "track": "B"}]}, {"start": "11:00", "end": "11:30", "tracks": [{"title": "Coffee break", "kind": "break"}]}, {"start": "11:30", "end": "13:00", "tracks": [{"title": "Awards (papers, ECR papers), Announcements, Greetings", "kind": "event"}]}, {"start": "13:00", "end": "14:00", "tracks": [{"title": "Lunch", "kind": "break"}]}]}, "reserve": []}</script>
