<style>
  :root{
    --ink:#1C1B18;
    --paper:#F1EFE6;
    --sienna:#9A3620;
    --sienna-soft:#C8532E;
    --green:#1F6F54;
    --line:#D9D4C4;
    --muted:#6B655A;
    --card:#FBFAF5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    line-height:1.45;
    padding-bottom:48px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  /* ---- Balzana motif: Siena's black/white heraldic stripe ---- */
  .balzana{
    height:6px;
    background:repeating-linear-gradient(90deg,#111 0 22px, #fff 22px 44px);
    border-top:1px solid #00000022;
    border-bottom:1px solid #00000022;
  }

  .stickywrap{ position:sticky; top:0; z-index:20; }

  header.top{
    background:var(--ink);
    color:var(--paper);
    padding:18px 18px 0 18px;
  }
  header.top .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--sienna-soft);
    margin:0 0 4px 0;
  }
  header.top h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 2px 0;
    letter-spacing:-0.01em;
  }
  header.top .sub{
    font-size:12.5px;
    color:#C9C4B4;
    margin:0 0 14px 0;
  }

  .daytabs{
    display:flex;
    gap:2px;
    padding-top:2px;
  }
  .daytab{
    flex:1;
    text-align:center;
    padding:10px 4px 12px 4px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:#B7B2A2;
    background:transparent;
    border:none;
    border-bottom:3px solid transparent;
    cursor:pointer;
  }
  .daytab .d{ font-size:18px; font-weight:500; display:block; color:#EDEAE0;}
  .daytab.active{ border-bottom:3px solid var(--sienna-soft); color:var(--sienna-soft);}
  .daytab.active .d{ color:#fff; }

  .searchwrap{
    padding:12px 18px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .searchwrap input{
    width:100%;
    padding:10px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  .searchwrap input:focus{ outline:2px solid var(--sienna-soft); outline-offset:1px; }
  .searchmeta{ font-size:11.5px; color:var(--muted); margin-top:6px; font-family:'IBM Plex Mono', monospace; min-height:14px;}

  main{ padding:6px 18px 24px 18px; }

  .block{ display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); }
  .block .time{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--muted);
    width:44px;
    flex-shrink:0;
    padding-top:4px;
  }
  .block .time span{ display:block; }
  .tracks{ flex:1; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .tracks.two{ flex-direction:row; }
  .tracks.two > .card{ flex:1; min-width:0; }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
  }
  .card.event{ background:transparent; border:none; padding:4px 0 4px 0; }
  .card.event .label{ font-size:13.5px; color:var(--muted); font-style:italic; }
  .card.keynote{ border-left:3px solid var(--green); }
  .card.keynote .label{ color:var(--green); font-weight:600; font-size:13.5px;}

  .card.session{ cursor:pointer; }
  .card.session .tracklabel{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--sienna);
    text-transform:uppercase;
    letter-spacing:.08em;
    margin-bottom:2px;
  }
  .card.session h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15.5px;
    margin:0 0 4px 0;
    line-height:1.25;
  }
  .card.session .count{ font-size:11.5px; color:var(--muted); }
  .card.session .chev{ float:right; color:var(--muted); font-size:12px; }

  .paperlist{ margin-top:8px; display:none; }
  .paperlist.open{ display:block; }
  .paper{ padding:9px 0; border-top:1px dashed var(--line); }
  .paper:first-child{ border-top:1px solid var(--line); margin-top:6px; }
  .paper .ptop{ display:flex; gap:6px; align-items:baseline; flex-wrap:wrap; }
  .paper .pid{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--sienna); }
  .paper .ptype{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    text-transform:uppercase;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:4px;
    padding:1px 5px;
  }
  .paper .ptitle{ font-weight:500; font-size:13.5px; margin:3px 0 2px 0; }
  .paper .pauthors{ font-size:12px; color:var(--muted); }
  .paper .pmore{ font-size:11.5px; color:var(--sienna); margin-top:4px; cursor:pointer; text-decoration:underline; text-decoration-color:var(--line); }
  .paper .pdetail{ display:none; font-size:12.5px; margin-top:6px; color:#3a382f; background:var(--paper); border-radius:6px; padding:8px 10px; }
  .paper .pdetail.open{ display:block; }
  .paper .pdetail .kw{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); margin-top:6px; }

  mark{ background:#F3D9B9; color:inherit; border-radius:2px; }

  h2.daytitle{
    font-family:'Fraunces', serif;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--muted);
    margin:18px 0 4px 0;
  }

  .reserve{
    margin-top:26px;
    padding-top:16px;
  }
  .reserve h2{
    font-family:'Fraunces', serif;
    font-size:16px;
    margin:0 0 8px 0;
  }
  .reserve p.note{ font-size:12px; color:var(--muted); margin:0 0 10px 0;}

  .empty{ text-align:center; padding:40px 20px; color:var(--muted); font-size:13.5px; }

  footer{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    padding:18px;
  }
</style>
</head>

<script id="program-data" type="application/json">{"agenda": {"15": [{"start": "14:30", "end": "15:00", "tracks": [{"title": "Registration", "kind": "event"}]}, {"start": "15:00", "end": "17:00", "tracks": [{"title": "Workshop", "kind": "event"}]}, {"start": "17:00", "end": "17:30", "tracks": [{"title": "Welcome", "kind": "event"}]}], "16": [{"start": "09:30", "end": "10:00", "tracks": [{"title": "Registration", "kind": "event"}]}, {"start": "10:00", "end": "11:00", "tracks": [{"title": "Keynote speech — Wykowska", "kind": "keynote"}]}, {"start": "11:00", "end": "11:30", "tracks": [{"title": "Coffee break", "kind": "break"}]}, {"start": "11:30", "end": "13:00", "tracks": [{"title": "Assistive Technologies and Human-Centred Design", "kind": "session", "session": {"title": "Assistive Technologies and Human-Centred Design", "papers": [{"id": 27, "type": "long", "title": "Embodying Conversational Agents in Paediatric Speech Therapy: A systematic review", "authors": "Alessia Nicoletta Marino, Liliana Vale Costa and Patrizia Marti", "keywords": "ECAs\nSpeech Therapy\nChildren\nReview", "abstract": "Language disorders in pediatric age affect not only\nlinguistics, but also social and educational dimensions.\nSpeech therapy rehabilitation therefore plays a crucial\nrole, rehabilitative practices can be effectively supported\nby technology. In this context, Embodied Conversational\nAgents (ECAs) represent a promising tool, although their\nspecific use in pediatric speech therapy has not yet been\ncomprehensively explored. A systematic search, according to\nPRISMA 2020 guidelines, was conducted across PubMed, Scopus\nand ACM Digital Library for papers published between 2010\nand 2026. A total of 200 records were identified, with 24\nstudies meeting the inclusion criteria. This review\naddresses three research questions concerning the types of\ndisorders treated, the embodiments adopted, and the\nclinical outcomes achieved. The analysis reveals a limited\nbut increasing number of studies, suggesting that ECAs are\nan emerging tool not yet widely adopted in clinical\npractice, predominantly used for language rehabilitation,\nbut also applicable to social skills development.\nPhysically embodied ECAs appear predominant, with a\ndistinction between custom-developed systems and\ncommercially available platforms; in both cases, a\nnon-threatening, toy-like appearance prevails. Clinical\noutcomes appear promising, but the areas in which\nintervention proves most effective remain to be defined\nwith greater precision."}, {"id": 47, "type": "long", "title": "Cultural Orientation Shapes Moral Judgments of Autonomous Vehicle Dilemmas", "authors": "Eda Isil Sukan, Augusto Bovesi and Stefano Guidi", "keywords": "Autonomous Vehicles\nMoral Decision-Making\nCultural Orientation\nPassenger-Pedestrian Dilemma\nFraming Effects", "abstract": "Autonomous vehicles (AVs) promise enhanced road safety but\nface acceptance challenges due to unavoidable moral\ndilemmas, particularly passenger-pedestrian conflicts.\nCultural orientation and message framing may influence\nmoral evaluations of AV decisions, yet their effects remain\nunderexplored. Here we conducted an online survey with 346\nparticipants from individualistic (US, Italy) and\ncollectivistic (Turkey, Indonesia) cultures, manipulating\nthe number of lives at stake and framing AV benefits as\nneutral, individualistic, or collectivistic. Results\nrevealed a modest overall preference for\npedestrian-protective choices, modulated by contextual\nfactors and cultural orientation, with collectivist\nindividuals favoring pedestrian protection more.\nUnexpectedly, both individualistic and collectivistic\ngain-framed messages reduced this preference relative to\nneutral framing, likely by increasing identification with\nAVs as personal tools and shifting preferences toward\npassenger protection. These findings suggest that how AV\ntechnology is communicated significantly shapes moral\nexpectations across cultures, informing strategies to\nenhance public acceptance."}, {"id": 8, "type": "long", "title": "Human behavior facing a vehicle in shared spaces: investigating the relation between action and perception", "authors": "Lydie Baillard, Sandrine Caroly, Manon Prédhumeau and Julie Dugdale", "keywords": "Ergonomics\nPedestrians\nVulnerable road users\nInteractions", "abstract": "Autonomous vehicles will have to interact safely with\npedestrians when integrated into cities. Some urban areas\napproach the shared space concept, where road users\ninteract closely without explicit rules and across multiple\ndirections. Observing pedestrian behavior in shared spaces\nwith conventional vehicles provides insight into how\nautonomous vehicles can be effectively integrated into such\nspaces. However, studies of interactions between vehicles\nand pedestrians often lack shared space data and mostly\nfocus on the crossing scenario. In this paper, we conducted\nobservations of pedestrian interactions with vehicles in a\nshared space and categorized behaviors based on gaze,\nmovement, gestures, and oral communication. We propose gaze\nand trajectory deviations as representative of information\ntreatment by pedestrians, linking perception and action,\nand compare different interaction types. We also noted some\ntrajectory deviations and protective behaviors in\npedestrian groups."}, {"id": 45, "type": "wip", "title": "A Phygital Game Prototype to Support Speech-Therapy-in-the-Loop AI in Pediatric Rehabilitation", "authors": "Alessia Nicoletta Marino, Liliana Vale Costa and Patrizia Marti", "keywords": "Phygital game\nSpeech Therapy\nChildren\nEmbodied Conversational Agent\nPediatric Rehabilitation", "abstract": "Speech perception is one of the fundamental prerequisites\nfor correct language development in childhood. This process\nmay be compromised in children with Speech Sound Disorders\n(SSD), for whom early speech therapy intervention is\nessential. In this context, play-storytelling may\nconstitute privileged intervention tools, given it can\nsimultaneously activate physical, cognitive, and\nsocio-emotional dimensions in child development, making it\na speech therapist’s ally in repetitive activities of\nrehabilitative practices This work-in-progress paper,\npresents a phygital game designed to improve phoneme\nrecognition in children with SSD.  Grounded in the\nprinciples of Self-determination Theory (SDT) combined with\nTRACE Speech Perception Theory, the game aims to assist the\nspeech perception activities using a physical component,\nconsisting of composable phoneme cards, and an Embodied\nConversational Agent (ECA) acting as mediator, storyteller,\nand motivator. A conceptual framework on the use of an ECA\nin a phygital environment associating Autonomy, Competence\nand Relatedness (SDT theory) to categorical perception in\nspeech rehabilitation is presented, involving a triadic\nrelationship among child, game-based ECA phygital\nintervention and the therapist. As future work, we plan to\nrefine the current prototype and conduct a first pilot test\nwith speech therapy professionals."}, {"id": 17, "type": "wip", "title": "Towards Intelligent Virtual Agents for Visual Monitoring of Assembly Tasks", "authors": "Sofie Magdalena Schwenkreis, Vera Marie Memmesheimer and Achim Ebert", "keywords": "Intelligent Virtual Agents\nEmbodiment\nVisual Monitoring\nAssembly Task\nApple Vision Pro", "abstract": "Manual assembly is essential in domains of high tactile\ncomplexity and product variability such as aircraft\nmanufacturing, automotive assembly lines, or at-home\nfurniture construction. Here, agentic artificial\nintelligence (AI) is deployed to visually monitor the\nassembly process and offer varying levels of support. At\nthe same time, assembly tasks may benefit from the\napplication of Mixed Reality (MR) which seamlessly\nintegrates virtual elements in the physical space.\nCombining AI and MR allows a fundamental transformation of\nvisual monitoring systems in assembly tasks and opens a\nvast, underexplored design space for intelligent virtual\nagents (IVAs). In this paper, we begin to systematically\nnavigate and structure this space. To this end, we\ndeveloped a MR prototype for the Apple Vision Pro featuring\ntwo contrasting virtual agent representations, one abstract\nand one humanoid, which provide assistance in two assembly\ntasks. Semi-structured expert interviews clearly reveal two\nopposing preferences: while some experts favored the\nabstract agent's ability to transparently signal its\nmachine-based logic, others perceived the humanoid agent as\nmore natural. This implies that a one-size-fits-all\napproach to agent design -- which is often pursued -- may\nbe insufficient. Moving forward, we aim to investigate\nadaptive agent representations that can be dynamically\ntailored to user preferences and special task requirements."}]}}]}, {"start": "13:00", "end": "14:00", "tracks": [{"title": "Lunch", "kind": "break"}]}, {"start": "14:00", "end": "14:30", "tracks": [{"title": "Poster presentations", "kind": "event"}]}, {"start": "14:30", "end": "15:00", "tracks": [{"title": "Poster exhibition", "kind": "event"}]}, {"start": "15:00", "end": "17:00", "tracks": [{"title": "Collaborative Design, Infrastructure and Work Practices", "kind": "session", "session": {"title": "Collaborative Design, Infrastructure and Work Practices", "papers": [{"id": 24, "type": "long", "title": "Towards Urban Air Mobility: Exploring how to support collaborative planning and communication in drone projects", "authors": "Jekaterina Basjuka, Jonas Löwgren, Carl Westin and Jonas Lundberg", "keywords": "Collaborative planning\nCommunication\nUAM\nStorytelling\nDrone\nCo-design", "abstract": "As drones become integrated into urban contexts,\nstakeholders such as city planners and drone operators must\ncollaborate to plan, regulate, and execute operations.\nHowever, many lack a shared understanding of drone\ncapabilities, regulatory processes, and planning\nrequirements, leading to coordination challenges. This\npaper presents an exploratory investigation of two\nprototypes supporting collaborative drone work: a Digital\nPlanning Platform for structuring multi-stakeholder\nplanning and a Library of Explanatory Stories for\ncommunicating foundational concepts. Developed through\niterative engagement with an expert drone operator and\nevaluated with municipal representatives and drone operator\nstudents, the findings indicate that structured visual\nplanning supports coordination, risk awareness, and shared\nreference points, while storytelling aids introductory\nunderstanding. At the same time, challenges related to\ndigital literacy, organizational integration, narrative\nsimplification, and visual credibility were identified. The\npaper contributes both the design of these prototypes and a\nset of design principles for structuring interaction and\ntranslating complex domain knowledge to support shared\nunderstanding in multi-stakeholder drone work."}, {"id": 34, "type": "long", "title": "deMIT Open Research: A Cognitively Sustainable Infrastructure for Shared Knowledge", "authors": "Simone Giancaspero, Arianna Mazza and Stefano Guidi", "keywords": "Open Science infrastructure\nCognitive sustainability\nHuman-technology cooperation", "abstract": "This paper presents deMIT Open Research, an exploratory\nproject developing a digital infrastructure for knowledge\nsharing within the National Doctoral Programme in Design\nfor Made in Italy. Addressing the fragmentation of research\nproduction across a dispersed community, the initiative\ncombines co-design and action research across four phases:\nco-creation, keyword normalisation, prototyping of an\ninteractive R/Shiny web application, and ongoing\nintegration with the institutional platform ATENA. The\nresulting tool makes thematic affinities among doctoral\nprojects visible through keyword-based network\nvisualisation, supporting community-building and\nsustainable open research practices."}, {"id": 13, "type": "long", "title": "Articulation Work and Conventions: The Workers’ Experience", "authors": "Romain Roccamatisi, Nadia Gauducheau and Myriam Lewkowicz", "keywords": "Conventions\nArticulation Work\nQuality of Life at Work\nHybrid Work\nReflexivity\nWorkshops", "abstract": "In cooperative work settings, coordination relies on shared\npractices known as conventions. These conventions are often\nimplicit, taken for granted, and rarely discussed, despite\ntheir central role in organizing distributed work. While\nearly CSCW studies have highlighted their importance, the\nevolution of digital artifacts and the rise of hybrid work\ncall for renewed attention to how workers perceive them\ntoday. This study explores workers’ experiences with\nconventions in contemporary digital environments through\nworkshops conducted in two organizations. Participants were\ninvited to identify, discuss, and reflect on the\nconventions shaping their digital collaboration. The\nfindings reveal that conventions are unevenly recognized\nand shared, remain highly situated, and are continuously\nrenegotiated as new tools and colleagues are introduced.\nWhile conventions support articulation work, their lack of\nexplicit recognition and discussion can hinder\ncoordination. This paper contributes to CSCW research by\nexamining current experiences of conventions and\ndemonstrating that making them visible and discussable\noffers a valuable lens for understanding cooperative work.\nIt also shows that workshop-based approaches can foster\nreflection on conventions, thereby supporting smoother\ncoordination and improving quality of working life."}, {"id": 4, "type": "short", "title": "Visual Storytelling for Knowledge Sharing in Co-Design Workshops on Urban Air Mobility", "authors": "Jekaterina Basjuka, Carl Westin and Jonas Lundberg", "keywords": "visual storytelling\nco-design\nUAM\ndrone\nsimulation\nknowledge sharing", "abstract": "Urban Air Mobility requires cities to collaboratively plan\nuncertain futures with stakeholders who hold diverse\nexpertise and priorities. Co-design workshops and\nsimulations can support this, but the contextual reasoning\nemerging from discussions is typically lost to fragmented\nnotes creating a gap between what simulations show and what\nstakeholders know. This study explores visual storytelling\nas a mediating mechanism: short narrative video segments\nembedded in drone traffic simulation encode stakeholder\nreasoning from one workshop and replay it for subsequent\nregional groups. Tested across five workshops in four\nSwedish regions, findings suggest the approach helped\nsurface domain challenges such as regulatory uncertainty\nand infrastructure ownership that simulation alone cannot\ncapture. However, the study also revealed that groups at\nmore advanced stages of UAM development tended toward\nsolution-focused discussions, and that differences in\nregional UAM familiarity affected cross-workshop knowledge\ntransfer, pointing to the importance of workshop sequencing\nand facilitation in future iterations."}, {"id": 44, "type": "wip", "title": "Design through counterfactual theatre: an embodied simulation method for designing digital social touch", "authors": "Robin Héron, Stéphane Safin, Michael Baker and Françoise Détienne", "keywords": "Design\nActivity\nErgonomics\nTheatre\nSimulation\nCreativity", "abstract": "When designing the future, activity analysis has long been\nfruitful. Several research however point out the limit of\nanalysing current processes for accurately envisioning\nnewly designed tools and environments. To address this, the\nsimulation of the future activity through mock-ups,\nscenarios, games, or even theatre, is a go-to design\nmethod. In most cases, designers are outside of the\nsimulation, observing, commenting, directing what\nparticipants are doing. When the object of design involves\nstrong bodily sensations as in the case of touch, a deeper\nintegration of designers in embodied simulation could lead\nto increased creativity while keeping a foot in real life.\nIn this paper, we explore a design method combining theatre\nsimulation and counterfactual history to support creativity\nin simulated use context. For that purpose, we first\norganised 4 short creativity workshops to test out\ncounterfactual history scenarios and refine a protocol\nmethod. In a second phase, 6 similarly structured\ncreativity workshops were implemented, each counting 3 to 5\nparticipants. This article focuses on the method and its\nevaluation, our objective being to explore whether\nparticipants are able to design through embodied simulation\nof the activity. For this, we focus on analysis of three\nfactors: type of interaction, orientation of the action,\nsolutions."}]}}]}, {"start": "17:00", "end": "17:30", "tracks": [{"title": "Coffee break", "kind": "break"}]}, {"start": "18:00", "end": "19:00", "tracks": [{"title": "Keynote — Santa Chiara (Marti)", "kind": "keynote"}]}, {"start": "19:00", "end": "19:30", "tracks": [{"title": "Welcome", "kind": "event"}]}], "17": [{"start": "09:30", "end": "11:00", "tracks": [{"title": "Digital Wellbeing, UX and Behavioural Health", "kind": "session", "session": {"title": "Digital Wellbeing, UX and Behavioural Health", "papers": [{"id": 26, "type": "long", "title": "Employer organisations and counsellor attitudes towards digital interventions for mental health and wellbeing within the workplace: A qualitative analysis", "authors": "Gillian Cameron, Maurice Mulvenna, Edel Ennis, Raymond Bond, Siobhan O'Neill and David Cameron", "keywords": "mental health\ndigital mental health\nworkplace wellbeing\nrequirements gathering\nthematic analysis", "abstract": "Meaningful work supports employee wellbeing, yet mental\nhealth conditions remain common and contribute to\nsubstantial productivity loss. Digital mental health\ninterventions (DMHIs) offer scalable support but vary\nwidely in quality, personalisation, and integration into\nworkplace systems. This study explored how employer\norganisations commissioning wellbeing services and\ncounsellors delivering Employee Assistance Programmes\n(EAPs) perceive the role of DMHIs in workplace mental\nhealth. Semi-structured inter views with 14 employers and 5\ncounsellors were analysed using thematic analysis. Both\ngroups viewed DMHIs as most effective when embedded within\nbroader wellbeing programmes that include traditional\nservices such as counselling. Key barriers included\ntext-heavy content, poor navigation, limited\npersonalisation, and a lack of robust evidence and outcome\nmetrics. Enhanced integration, training, and alignment with\nevidence-based therapeutic models were seen as essential to\nincrease engagement and trust. Overall, DMHIs were\nconsidered valuable as part of a blended approach, though\nfurther work is needed to refine design requirements and\nunderstand how these tools can be most effectively\nincorporated into workplace wellbeing strategies.\nCollectively, these findings indicate that while many\nemployer organisations and counsellors recognise the\npromise of DMHIs, successful adoption depends on overcoming\npractical barriers and aligning tools with organisational\nand client needs."}, {"id": 21, "type": "long", "title": "Do Hedonic Aspects of Context Bias UX Evaluation? Evidence from Controlled Virtual Environments", "authors": "Rayane Mabrouki, Laetitia Gros, Julian Moreira, Jean-François Petiot and Franck Mars", "keywords": "User Experience (UX)\nContext of Use\nHedonic Quality\nVirtual Reality (VR)\nHalo Effect", "abstract": "In this article, we propose a novel conceptual dichotomy to\ncharacterize the effects of context on User eXperience\n(UX), distinguishing between pragmatic and hedonic\nqualities of context. Pragmatic qualities refer to aspects\nof the interaction environment that affect UX through the\nalteration of users’ ability to act, whereas hedonic\nqualities shape the experience by coloring it without\ndirectly impacting interaction capabilities. Focusing on\nthe latter, which remain comparatively underexplored, we\ninvestigate the influence of the hedonic qualities of the\nphysical context on UX evaluation. To this end, we\ndeveloped a dedicated questionnaire, the Hedonic Qualities\nof Context Scale (HQCS), and designed immersive virtual\nenvironments varying along these qualities. We conducted\ntwo controlled user studies in which participants\ninteracted with a TV service within these environments.\nWhile the environments elicited significantly different\nevaluations in terms of hedonic qualities, no differences\nwere observed in UX evaluation as measured by AttrakDiff.\nSimilarly, no variation in emotional state was found across\nconditions using the Self-Assessment Manikin. Taken\ntogether, these results suggest that hedonic qualities of\ncontext do not directly influence UX evaluation in the\nabsence of changes in users’ internal state. More broadly,\nthey support the interpretation that context impacts\nproduct perception only insofar as it alters the user’s\ninternal state, and highlight the role of potential\nmoderating factors—such as attentional engagement—in the\nmanifestation of contextual effects."}, {"id": 7, "type": "long", "title": "Symptoms matters: commonality and variability of gaming disorder symptoms across 35 countries", "authors": "Ala Yankouskaya, Mohamed Basel Almourad, Magnus Liebherr, Justin Thomas, Guandong Xu and Raian Ali", "keywords": "Gaming Disorder\nSymptom prevalence\nCross-national\nDiagnostic criteria", "abstract": "From a cognitive ergonomics perspective, contemporary\ndigital games are highly optimised interactive systems\ndesigned to capture and sustain attention by systematically\nengaging core cognitive processes such as attentional\nallocation, reward learning, and self-regulation. In this\nregard, Gaming Disorder (GD) has attracted considerable\nacademic attention. Yet, our understanding of the\nprevalence of this disorder at the symptom level and the\nhierarchy of the symptoms is limited. The current study\nseeks to clarify the symptom structure of GD by identifying\nwhich symptoms are most common, which are less frequently\nreported, whether the symptoms follow a hierarchical\npattern, and how consistent this structure is across\nnationally and culturally diverse populations. Using data\nfrom a large-scale, cross-national survey conducted across\n35 countries, we analysed prevalence and structure of the\nnine DSM-5 symptoms of GD in 24,733 gamers. To model\nsymptom prevalence while accounting for sampling\nuncertainty and country-level heterogeneity, we used\nBayesian multilevel logistic regression with partial\npooling of country-specific estimates. Escape and Tolerance\nemerged as the most reported symptoms, while Conflict and\nDeception were the least endorsed. Yet the most frequently\nreported symptom, Escape, was also the least connected to\nthe rest of the symptom network. A consistent\ncross-national hierarchy of symptoms was identified:\nEscape, Tolerance, and Displacement ranked highest in\nprevalence across nearly all countries, while Conflict and\nDeception ranked lowest. At the same time, countries varied\nsystematically in their overall likelihood of endorsing GD\nsymptoms. Our findings call for a re-evaluation of which\nsymptoms are most diagnostically meaningful, and caution\nagainst applying uniform diagnostic thresholds across\ndiverse populations."}, {"id": 10, "type": "short", "title": "Analyzing the Interest in Digital Wellbeing Services: Are People More Willing to Pay for Them on Social Network Sites or Messaging Platforms?", "authors": "Sameha Alshakhsi, Areej Babiker, Dena Al-Thani, Cornelia Sindermann, Christian Montag and Raian Ali", "keywords": "Digital wellbeing\nData business model\nWillingness to pay\nPrivacy\nHealthy Usage\nFake news\nPlatform design\nUser preferences", "abstract": "The prevalence of social network sites (SNS) and messaging\nplatforms (MSG) has transformed the way people communicate,\ninteract, and share knowledge, leading to social\ntransformations. However, concerns about digital wellbeing\n(DWB) have arisen due to issues such as personal data\ndisclosure, extremism, fake news, excessive usage, and\nmental health challenges. From a cognitive ergonomics\nperspective, these challenges are shaped by platform design\nand user interaction patterns, influencing users’\nattention, behavior, and overall digital experience, which\nhighlights the need for user-centered design approaches.\nThis study investigates how users value digital wellbeing\nand their willingness to pay (WTP) for DWB services across\nSNS and MSG, examining differences across demographic\ngroups. The analysis includes age, gender, financial\nwellness, and education. Data were collected from 262\nparticipants from European countries using an online\nquestionnaire assessing ten DWB services. Overall, WTP was\nhigher on SNS than MSG, with variations observed at the\nservice level. Participants were more willing to pay on MSG\nfor data protection and marketing purposes, while on SNS,\nthey preferred services addressing fake news,\nradicalization, and excessive use. These preferences\nremained consistent across demographics. The findings\nhighlight how users prioritize design interventions that\nsupport cognitive and behavioral regulation in digital\nenvironments. The results provide insights for designing\nergonomically informed, user-centered digital wellbeing\nfeatures and informing platform and policy strategies that\npromote healthier technology use."}, {"id": 15, "type": "wip", "title": "Gender Representation in Chatbot Design: Implications for User Experience", "authors": "Christof van Nimwegen and Lotte Consten", "keywords": "chatbots\nhci\ngender", "abstract": "This pilot study investigated the influence of gender of a\nchatbot and gender of users on the User Experience, along\nthe dimensions of warmth/friendliness, competence, trust,\nhuman-likeness user satisfaction and helpfulness. When\ninteracting with a chatbot, users often categorize it as\nfemale, gender-neutral or male, relying on stereotypes of\noffline human interactions. Current studies mostly compare\nonly male and female. “Neutral” is often omitted, just as\nthe context it takes place in, which might play a role. An\nexperiment done in which participants had dialogues with 3\nchatbots with different genders (female-neutral-male) in\ndifferent contexts (healthcare, financial, e-commerce).\nAfter each dialogue (with the same chatbot) participants\nfilled out a questionnaire gauging their experiences.\nResults showed no significant results as consequence of the\nmanipulations. Nevertheless, some trends are observed, some\npatterns point at a neutral chatbot being more appreciated,\nand that perhaps the device it took place plays a role. A\nfollow-up study will take place in which differences in\nchatbot gender are more strongly operationalized, with more\nnatural interactions in more realistic settings and with\nmany more participants."}]}, "track": "A"}, {"title": "Trust and Perception in AI and Robotic Systems", "kind": "session", "session": {"title": "Trust and Perception in AI and Robotic Systems", "papers": [{"id": 23, "type": "long", "title": "Moral Framing of Military Artificial Intelligence: The Role of Trust and Attitudes in Defensive and Offensive Use", "authors": "Oronzo Parlangeli, Antonio Brancati, Giorgia Callori, Matteo Chiasso, Leonardo Feroci, Arianna Fiorito, Francesca Mambrini, Michele Pio Piscopo and Francesco Currò", "keywords": "AI\nmilitary AI\ntrust\ncognitive Attitudes\naffective attitudes\nintelligence perception\nhalo effect\nethical implications\npersonality traits\nIWAH\ndark patterns", "abstract": "Despite growing research on public perceptions of\nArtificial Intelligence (AI), limited attention has been\npaid to how moral framing shapes evaluations of military\nAI. Drawing on research on trust in AI and the halo effect,\nthis study examines whether offensive versus defensive\nframing influences users’ perceptions across multiple\ndimensions, including cognitive attitudes, affective\nattitudes, and perceived intelligence. The study employed\nan online questionnaire with a between-subjects design.\nParticipants were randomly assigned to one of two\nconditions, in which they were presented with a scenario\ndescribing the development of an AI algorithm for either\ndefensive or offensive military purposes. Results showed\nthat, compared to defensive framing, offensive framing\nsignificantly reduced both cognitive and affective\nattitudes toward the AI system, as well as its perceived\nintelligence. Trust in AI emerged as a strong and\nindependent predictor across outcomes. Structural equation\nmodeling indicated that the effect of framing on perceived\nintelligence was largely mediated by affective and\ncognitive attitudes, consistent with a halo-like process in\nwhich moral evaluations shape competence judgments. No\nmoderating effects of personality traits or identification\nwith all humanity were observed. However, identification\nwith all humanity showed a significant negative association\nwith affective attitudes. These findings suggest that the\nperceived intelligence of military AI does not reflect an\nindependent assessment of system capability, but emerges\nfrom cognitive, affective and moral evaluations triggered\nby its intended use. More broadly, they highlight how\nrelatively subtle differences in framing can systematically\ninfluence public perceptions, raising concerns about the\npotential use of defensive narratives as persuasive devices\nin the communication of military AI. This study contributes\nto HCI by showing that AI evaluations are not only\ncontext-dependent but also morally constructed, with\nimportant implications for the design, communication, and\ngovernance of AI in high-stakes domains."}, {"id": 41, "type": "long", "title": "Using AI-Generated Videos to Simulate Different People Communicating the Same Healthcare Needs: An Exploratory Study of Care Prioritisation and Trust Across Health Professional and Public Groups", "authors": "Amanda Kearns, Anne Moorhead, Maurice Mulvenna and Raymond Bond", "keywords": "trust\nAI-mediated health communication\nAI-generated video case studies\ncare prioritisation\nbiopsychosocial care\ncognitive ergonomics\naffective ergonomics", "abstract": "Digital technologies increasingly shape how health\ninformation is presented and interpreted in\ncommunication-intensive contexts. In healthcare, such\ncommunication is cognitively and emotionally demanding,\nparticularly in contexts involving stigma and uncertainty.\nWhile evaluations of artificial intelligence (AI) systems\ntypically focus on performance and usability, less is known\nabout how AI-mediated health communication is experienced\nand interpreted as cognitive and emotional workload.\n\nThis study examines how health professionals and members of\nthe public interpret AI-mediated health communication under\ncontrolled conditions. Four AI-generated video case studies\nwere developed, each simulating a client presenting\nconcerns related to obesity and mental health within a\nhealthcare consultation, delivered as a one-way,\nnon-interactive communication. Each case followed a shared\ncore narrative with structured variation in sociocultural\ncontext, enabling comparison of interpretation under\nconsistent informational conditions. Participants were\nrandomly assigned to view one video within an online survey\nand completed ranking tasks on care priorities alongside\nevaluations of AI’s impact on communication and trust.\n\nAcross cohorts, psychological and lifestyle-related care\nwere prioritised over biomedical interventions, indicating\na shared biopsychosocial framing of care. Responses to\nAI-generated communication were characterised by\nambivalence, with concerns centred on loss of human touch,\noversight, and relational risk rather than technical\nperformance. Variability in viewer perception was observed\nacross avatars among public participants, suggesting\nsensitivity to sociocultural cues despite standardised\ncontent.\n\nThese findings indicate that ambivalence and variability\nreflect adaptive responses to cumulative cognitive,\nemotional, and organisational demands rather than\nresistance or error. Trust is reframed as a conditional\njudgement shaped by relational expectations and\norganisational context. Implications are discussed for the\ndesign of AI-generated communication systems in emotionally\ncomplex care domains."}, {"id": 55, "type": "long", "title": "Clean or simplistic? Testing a lower granularity algorithmic explainer for users’ comprehension, trust, and preference", "authors": "Anna Spagnolli, Elena Capuozzo, Valentina Zaccaria, Olivia Casadei, Suleyman Ozturk, Idil Akyurt, Arianna Stropeni and Gian Antonio Susto", "keywords": "explainable AI\nvisual explanations\ntrust\nuser-based assessment", "abstract": "The growing demand to reduce the opacity of algorithmic\nsystems has led to the development of numerous Explainable\nArtificial Intelligence (XAI) methodologies that provide\nclear and coherent explanations for specific algorithmic\npredictions. In several real-life domains, the need for\nrapid explanation motivates the use of models, such as AcME\n(Accelerated Model-agnostic Explanations), that\nsignificantly improve time efficiency in both computation\nand comprehension compared with reference models. However,\nthe lower granularity of their output visualizations can\nnegatively impact their perceived trustworthiness. In this\nstudy, we compared AcME explanations with a benchmark\nexplainer, SHAP (SHapley Additive exPlanation), in terms of\nusers’ comprehension, trust and preference. We run two\nstudies (N = 146) collecting both quantitative and\nqualitative data via the Qualtrics survey platform. The\nresults suggest that the lower granularity of AcME\nexplanations does not compromise their trustworthiness or\ncomprehensibility relative to the benchmark. Furthermore,\nusers’ preferences depended on several motivations, only\npartially satisfied by each method; AcME was preferred for\nits easy-to-read, clean layout, and SHAP was preferred\nagain for its ease of understanding and richness of\ninformation."}, {"id": 20, "type": "short", "title": "The Fear of AI is the Fear of Looking in the Mirror: Low Trait Honesty-Humility Predicts Individual Perceived Likelihood of Future Apocalyptic AI Scenarios Through Beliefs in a Competitive World", "authors": "Enrico Cipriani, Danilo Menicucci and Simone Grassini", "keywords": "Artificial Intelligence\nAI anxiety\nAI narratives\nSocial Dominance Orientation\nDual-Process Model\nAnthropomorphism\nIndividual differences", "abstract": "Apocalyptic narratives about Artificial Intelligence (AI),\nin which a future superintelligence dominates or\nannihilates humanity, have become a prominent source of\npublic anxiety and a central concern in the AI alignment\ndiscourse. Because the behavior of a hypothetical\nsuperintelligent AI is fundamentally unknowable, individual\nexpectations about such scenarios may reflect projections\nof users' own social worldviews and self-perceptions rather\nthan grounded technological forecasts. Drawing on Duckitt's\ndual-process model of ideological attitudes, we tested\nwhether beliefs in a competitive or dangerous world, Social\nDominance Orientation (SDO), and Right-Wing\nAuthoritarianism (RWA) predict the perceived likelihood of\napocalyptic AI futures in a preregistered online survey of\na representative UK sample (N = 300). Mediation and\nhierarchical regression analyses revealed that belief in a\ncompetitive world robustly predicted perceived likelihood\nof apocalyptic and domination-specific AI scenarios, even\nafter controlling for AI literacy, AI attitudes, AI use,\nand demographics. Critically, low trait Honesty-Humility\nindirectly predicted AI domination beliefs through\ncompetitive worldview, supporting a \"projection\"\ninterpretation: individuals who perceive themselves as\nmanipulative and exploitative expect the same of a\nhypothetical superintelligent AI. We discuss implications\nfor understanding AI anthropomorphism, AI anxiety, and the\nsocio-psychological roots of apocalyptic AI narratives."}, {"id": 32, "type": "wip", "title": "When appearance meets personality: robot age and individual differences in the evaluation of cheating robots", "authors": "Ludovica Misino, Stefano Guidi, Luca Lusuardi, Alessandro Innocenti and Oronzo Parlangeli", "keywords": "Human–Robot Interaction (HRI)\nRobot age\nDark Triad\nLie acceptability\nMind perception", "abstract": "As robots increasingly engage in autonomous and socially\nmeaningful actions, understanding how humans evaluate\nmorally ambiguous robot behaviour is a central challenge in\nHuman–Robot Interaction (HRI). This study investigates how\nrobot age cues and individual differences influence the\nevaluation of deceptive behaviour displayed by robots in\nimmersive virtual reality. Drawing on theories of mind\nperception and moral agency, we examine whether Dark Triad\npersonality\ntraits and lie acceptability shape tolerance toward robot\ncheating and interact with robot age (adult-like vs.\nchild-like) in predicting perceived agency, experience,\nmoral responsibility, and trust.Participants interacted\nwith a humanoid robot that\nengaged in systematic cheating during a competitive\nrock–paper–scissors task in virtual reality. Results (N =\n56) show no significant main effect of robot age on moral\nor cognitive evaluations, suggesting that explicit cheating\nbehaviour may\noverride appearance-based cues. However, significant\ninteractions emerged between robot age and individual\ndifferences. Narcissism was positively associated with\nperceived agency and experience, but only for adult-like\nrobots. Similarly, lie\nacceptability predicted higher perceived experience and\nlower dependency exclusively in the adult-like condition.\nThese findings suggest that the evaluation of robot\nmisconduct depends on the interaction between design\nfeatures and observer\ndispositions rather than on robot characteristics alone.\nAdult-like robots appear to amplify individual differences,\nwhereas\nchild-like robots may attenuate them.The study contributes\nto HRI research by highlighting the importance of\nconsidering\nboth user traits and design cues in morally sensitive\ninteractions, with implications for the development of\nsocially acceptable artificial agents taking into\nconsideration ethical concerns regarding the strategic use\nof dark patterns in the\nfield of social robotics. Ultimately, these findings\nadvocate for HRI design standards that prioritize\nbehavioral transparency\nand ethical accountability."}]}, "track": "B"}]}, {"start": "11:00", "end": "11:30", "tracks": [{"title": "Coffee break", "kind": "break"}]}, {"start": "11:30", "end": "13:00", "tracks": [{"title": "Generative AI, Cognition and Human Augmentation", "kind": "session", "session": {"title": "Generative AI, Cognition and Human Augmentation", "papers": [{"id": 6, "type": "long", "title": "Generative AI Makes Creative Output More Homogeneous", "authors": "Alwin de Rooij and Michael Mose Biskjaer", "keywords": "Generative Artificial Intelligence\nHomogenization\nHuman–AI Co-Creation\nMeta-Analysis", "abstract": "Does generative AI make us think alike? As human–AI\nco-creation becomes embedded in creative practice, concerns\nhave emerged that creative outputs may exhibit\nhomogenization, as reduced diversity of meanings, across\nusers, even when individual creativity improves. We address\nthis concern through a systematic review and three-level\nmeta-analysis of empirical studies on homogenization in\nhuman–AI co-creation (19 studies, 61 effect sizes). Results\nreveal a small but statistically significant homogenization\neffect associated with AI use, robust across sensitivity\nanalyses and not explained by publication bias. Moderator\nanalyses indicate that homogenization is task-sensitive,\nwith stronger effects in semantically constrained ideation\ntasks than in minimally constrained divergent thinking\ntasks. Additional analyses suggest that homogenization may\npersist beyond co-creative episodes and extend to\nreal-world contexts. Rather than indicating a loss of\ncreativity, these findings point to a gradual,\nscale-dependent reorganization of creative diversity shaped\nby task structure, interaction workflows, and\nsociotechnical feedback processes."}, {"id": 48, "type": "long", "title": "When AI Answers Too Soon: The Displacement of Reflective Inquiry in Design", "authors": "Peter Dalsgaard", "keywords": "Cognition\nHuman-Computer Interaction\nGenerative Artificial Intelligence\nInquiry\nDesign", "abstract": "Generative AI tools are evaluated almost exclusively by the\nquality and speed of their outputs. This paper argues that\nsuch evaluation misses a key element: what AI tools do to\nthe temporal structure of the inquiry process, and\ntherefore to the practitioner engaged in it. Drawing on\nSchön's account of reflective practice, Dewey's theory of\ninquiry, and the phenomenology of skilled tool use, the\npaper proposes a three-phase model of AI-mediated inquiry\nand identifies where, in each phase, current AI tools tend\nto displace the reflective and developmental work of the\npractitioner. The cumulative mechanism is named\n\\emph{reflective short-circuiting}: the restructuring of\ninquiry by AI systems in ways that shorten, pre-empt, or\nsubstitute for the temporally extended moments through\nwhich practitioners constitute problems, experience\nuncertainty, and develop reflective judgment. The paper\ndistinguishes reflective short-circuiting from adjacent\nconstructs including cognitive offloading and deskilling,\nsituates it within cognitive ergonomics through Rasmussen's\nSkills-Rules-Knowledge taxonomy and Hollnagel's\nefficiency-thoroughness trade-off, and proposes design\nprinciples for AI tools oriented toward keeping the\nproductive phases of inquiry intact."}, {"id": 54, "type": "long", "title": "The Generation Effect and AI-Assisted Writing: Towards a Framework of Cognitive Fidelity", "authors": "Peter Dalsgaard", "keywords": "Generative AI\nWriting\nGeneration Effect\nCognition\nCognitive Fidelity\nAI-Assisted Writing\nHuman-Computer Interaction", "abstract": "Writing has long been understood as an epistemic activity:\na way of developing thought, not merely expressing it. The\ngeneration effect in cognitive psychology shows that\nself-generated material is remembered and understood\nsignificantly better than passively received material, and\nwriting research has long argued that the productive\nstruggle of articulation and reformulation is itself a\nvehicle for knowledge transformation. Generative AI changes\nthe conditions under which this cognitive work occurs. When\nwriters shift from generating to evaluating and selecting\nAI-produced text, they move from a generation condition to\nsomething closer to a reading or response condition, which\nmay lack the cognitive properties that have historically\nmade writing a powerful epistemic tool. This paper argues\nthat critical facets of AI-mediated writing are\nunder-theorized because current research focuses on output\nquality, efficiency, and integrity rather than on the\ncognitive value of the writing process itself. We introduce\nthe concept of \\textit{cognitive fidelity}, understood as\nthe degree to which a writing process requires the writer\nto generate rather than receive the emerging text, as a\nframework for analyzing these conditions and as a design\ncriterion for evaluating and building AI writing tools. We\ndevelop three dimensions of cognitive fidelity\n(origination, articulation, and reformulation), situate the\nconcept relative to existing frameworks, and draw out\nimplications for the design of AI writing tools and for\nfuture research."}, {"id": 53, "type": "wip", "title": "Exploring Trust Factors in Designing AI-Supported Performance Appraisal System", "authors": "Andreas Harnindito and Akshat Sawarni", "keywords": "Performance appraisal\nArtificial intelligence\nTrust\nHuman-AI collaboration", "abstract": "Performance appraisal is a critical organizational process\nthat directly influences employee development,\ncompensation, and career progression. Despite growing\ninterest in AI-assisted appraisal systems, little is\nunderstood about the factors that make such systems\ntrustworthy from the perspective of those who use them.\nThis study addresses this gap by investigating the factors\nthat shape trust in AI-supported performance appraisal\nacross three stakeholder groups: managers, employees, and\nHR professionals. Using semi-structured interviews with 12\nparticipants across six countries and reflexive thematic\nanalysis, the study identifies three overarching themes\nfrom the manager cohort. First, trust in the current\nappraisal process is already structurally compromised by\nrecency bias, unacknowledged subjectivity, and opacity.\nSecond, trust in AI is contingent upon non-negotiable\nboundaries, including explainability, data quality, and\nhuman oversight. Third, AI integration carries dual\nimplications, where it can either restore fairness through\nlongitudinal consistency or deepen distrust through bias\namplification and privacy invasion. The findings suggest\nthat trustworthy AI integration requires addressing\npre-existing structural failures before introducing\nalgorithmic decision support. These results offer design\nrecommendations for AI-supported appraisal systems, with\nimplications for HCI research and organizational practice."}, {"id": 36, "type": "short", "title": "Rethinking Prosthetic Hands: From Transparent Replacement to Intelligent Instruments", "authors": "Maria Rosanna Fossati, Cristina Piazza and Antonio Bicchi", "keywords": "prosthetics\ncognitive ergonomics\nshared autonomy\nUser centered design\nhaptic feedback", "abstract": "The dominant paradigm in upper-limb prosthetics has long\nbeen grounded in the principle of biological replacement:\nthe prosthesis is conceived as the functional completion of\na missing body part, ideally restoring natural and full\ntransparent control. Despite major advances in design and\nengineering (mechatronics, sensing, and control), this\ntransparency paradigm continues to place a substantial\ncognitive burden on the user, who must often supervise and\ncontrol low-level actuation details. We observe a\nconceptual shift that opens an opportunity for renewed\ntechnology design: prosthetic hands should no longer be\nconceived primarily as body replacements striving for full\ntransparency, but rather as intelligent instruments\noriented toward user experience, task efficacy, and shared\nautonomy. Drawing on human factors research, cognitive\nergonomics, neuroscience on embodiment, we propose a\ndeductive, human-centered design framework in which levels\nof autonomy are structured around human perceptual and\ncognitive constraints. We argue that shared autonomy in\nprosthetics should mirror the logic of other intelligent\nartifacts, where autonomous intervention reduces cognitive\nload while preserving user agency. From this perspective,\nembodiment is reframed not as complete transparency, but as\na calibrated integration between perception and action,\nwhile trust is reframed as appropriate reliance on an\nintelligent partner system. We conclude with a tangible\nexample concerning haptic feedback."}]}, "track": "A"}, {"title": "AI, Automation and the Future of Work", "kind": "session", "session": {"title": "AI, Automation and the Future of Work", "papers": [{"id": 57, "type": "long", "title": "Identity in the Loop Cognitive Ergonomics of the Mediated Voice and the Future of Service Work", "authors": "Cosimo Spera", "keywords": "cognitive ergonomics\nhuman–AI interaction\nAI governance\nContact centers\nFuture of Work", "abstract": "This is a conceptual paper in cognitive ergonomics.\nReal-time AI systems that modify human vocal, physical, or\nbehavioural presentation during live interactions are\nentering service-work infrastructure at scale, and existing\ncognitive-ergonomic frames — automation, augmentation,\nhuman-in-the-loop supervisory control — handle this\nclass of intervention poorly. We offer three contributions.\nConceptually, we define identity-layer AI as a new\nlocus of intervention in human–technology interaction: one\nin which the AI acts neither on the worker’s task\nnor on the informational resources used to perform the\ntask, but on features of the worker’s embodied output\nthat carry identity information before the output reaches\nthe receiver. Analytically, we introduce a three-party\nmental-model asymmetry framework in which worker, deploying\nenterprise, and receiving customer hold partial\nand non-overlapping models of what is being modified, by\nwhom, and toward what target profile; we connect\nthis asymmetry to ethnographic work on pre-AI accent\nneutralization and argue that AI-based systems automate\na documented-harmful practice at infrastructure scale.\nPractically, we derive a research agenda for the field —\nincluding four concrete study designs using established\ncognitive-ergonomic instruments—and sketch the minimal\ndesign and governance obligations that the analysis\nimplies. We use AI-powered accent modification in global\ncontact centres as the leading deployment case and draw on\npublicly available worker-experience reporting as a\npreliminary evidence base. The paper concludes with\nimplications for the future of service work: the dissolution\nof embodied locality, longitudinal risk of occupational\nidentity drift, and the measurement challenges that arise\nwhen AI modifies rather than replaces human output."}, {"id": 40, "type": "long", "title": "Safeguarding Human Potential in Automated Work Systems: A Capability-Centred Framework for Design and Evaluation", "authors": "Lisa Diamond and Michael Oppermann", "keywords": "human-automation interaction\ncapability sustainability\ncognitive ergonomics\nwork design\nhuman-centred AI", "abstract": "Automation and AI increasingly reshape work systems beyond\ntask execution, influencing how human capabilities are\nused, preserved, or transformed. Cognitive ergonomics\ntraditionally evaluates automation through constructs such\nas workload, situation awareness, trust, and function\nallocation. While these lenses explain performance and\ninteraction quality, they do not systematically capture\nwhether automation sustains, erodes, or expands human\nexpertise and professional agency over time. This paper\nintroduces a capability- centred framework for Human\nPotential in Automation (HPA) comprising four dimensions:\nOptimisation, Retention, Expansion, and Engagement. The\nframework conceptualizes automation as generating\nbidirectional capability trajectories—risk of degradation\nor opportunity for development—depending on system design\nand organizational embedding. Building on this\nconceptualization, we introduce a lightweight translational\nartifact (“action cards”) to support design reflection, and\na concise 12-item companion scale to enable systematic\nevaluation of capability outcomes. We report insights from\na multi-case exploratory study involving four industrial\nstakeholders in AI-supported quality control. The\ncontribution extends cognitive ergonomics toward capability\nsustainability in automated work systems."}, {"id": 39, "type": "long", "title": "Augmented Intelligence for Professional Recruiting: designing an Advisor-in-the-Loop system to support the job interview process", "authors": "Martina Pozzolini, Gaetano Mongelli, Matteo Passarelli and Antonio Rizzo", "keywords": "Interaction design\nAI\nHuman-Centered AI\nHuman on the loop\nProfessional Recruiting", "abstract": "This paper presents the design and formative evaluation of\nan Augmented Intelligence (AuI) prototype that supports\nprofessional recruiters throughout the job interview\nprocess without automating it. We argue for a transition\nfrom the conventional Human-in-the-Loop (HITL) paradigm to\nan Advisor-in-the-Loop (AITL) architecture, in which the\nhuman expert operates as a Reasoning Architect —\nco-constructing the system’s evaluative logic before,\nduring, and after each interview rather than functioning as\na corrective checkpoint on an otherwise autonomous\npipeline. Building on theoretical analysis, interviewer\nfailure taxonomy, and primary field research with\nrecruiters and HR professionals, the prototype’s\nthree-layer architecture (Data, Modeling, Governance) and\nfour-phase interaction model (Scenario Designer, Live\nInterview Dashboard, Reflective Synthesis, Governance\nClosure) operationalize four non-negotiable governance\nproperties at the interface level: strict traceability,\nunconditional overrideability, active bias flagging, and\nexplicit accountability closure. A formative evaluation\ncombining heuristic inspection and structured expert review\n— conducted at prototype stage, prior to summative field\ndeployment — indicates that the design is internally\ncoherent, professionally acceptable, and free of major\ninteraction failures that would undermine its governance\nobjectives. The evaluation also surfaces a behavioral\nasymmetry between accepting and overriding AI suggestions\nunder time pressure, a finding that refines the design and\ncontributes to the broader HCI literature on automation\nbias in high-stakes decision-making. The paper’s central\nclaim is that in high-stakes social evaluation contexts,\nAugmented Intelligence is not a compromise between\nautomation efficiency and human oversight — it is the\nepistemologically correct design choice, because the\njudgment required cannot be reliably produced by either\ncomponent in isolation."}, {"id": 35, "type": "wip", "title": "\"AI will figure it out\": System Compensation and Intent Deferral in Open-Ended Generative AI Interfaces", "authors": "Paulo Ferreira and Sonia Sousa", "keywords": "Generative AI\nintent deferral\nsystem compensation\ncognitive ergonomics\nconstructive friction", "abstract": "Open-ended generative AI systems reshape how cognitive\neffort is distributed before and during task execution.\nThis work-in-progress paper introduces two interrelated\nconcepts: system compensation, the system's ability to\ngenerate coherent responses from underspecified inputs, and\nintent deferral, the user behavior of relying on the system\nto resolve missing task parameters. We argue that system\ncompensation may be removing a critical calibration signal\nto the user, potentially shifting automation-like\noverreliance upstream into the input construction phase.\nThree exploratory observational sessions with 23\nparticipants reveal four recurring interaction patterns. An\nintervention introducing constructive friction, requiring\nexplicit intent specification before a response, provoked\nresistance, suggesting that system compensation shapes\nexpectations of immediacy. We discuss implications for\ncognitive ergonomics and open-ended interface design."}, {"id": 60, "type": "short", "title": "LLM-empowered remanufacturing: A novel human-AI interaction under the lens of a scoping review", "authors": "Alireza Mortezapour, Mario Caterino and Marcello Fera", "keywords": "Industry 5.0\nSustainability\nrecycling\ndisassembly\nclosed-loop supply chain", "abstract": "In recent years, due to the high importance of raw\nmaterials, cost reduction pressures, and environmental\nconcerns, remanufacturing processes have gained significant\nimportance. In parallel, generative AI models have been\npenetrating into work environments to improve efficiency\nand effectiveness of the tasks. Aim of this article is to\nprovide a scoping review of studies addressing the use of\ngenerative AI in remanufacturing processes. The literature\nsearch was conducted across four major databases, and the\nresults were complemented using Google Scholar. In total,\n23 articles were included in the final stage of analysis.\nGenerative AI systems text-based, vision-based, and\nmultimodal, deployed both locally and in cloud-based\nenvironments, were found to be utilized in these processes.\nThe majority of studies focusing on LLM models developed by\nOpenAI. The most prominent contributions of generative AI\nwere observed in the following areas: Code Generation and\nRobotic Control, Safety and Risk, Supporting system\nperformance as a powerful “eye”, and Intelligent Planning\nand Reasoning (as the strategist of the system).\nIt appears that the initial phase of introducing diverse\napplications of generative AI models in remanufacturing\nprocesses is approaching its conclusion. In the coming\nyears, with the rapid advancement of generative AI, a\nsubstantial portion of these processes is expected to be\ndelegated to such systems, and it is even conceivable that\nthey may partially replace robots in certain tasks."}]}, "track": "B"}]}, {"start": "13:00", "end": "14:00", "tracks": [{"title": "Lunch", "kind": "break"}]}, {"start": "14:00", "end": "15:30", "tracks": [{"title": "Virtual Reality: Training, Cognitive Load and Therapy", "kind": "session", "session": {"title": "Virtual Reality: Training, Cognitive Load and Therapy", "papers": [{"id": 51, "type": "long", "title": "Balancing immersion and usability in virtual reality training: Effects on self-efficacy and user experience in mass casualty incident simulation", "authors": "Marie-Helene Ferrer, Marc Magniez, Cedric Basquin, Guillaume Mellon and Julien Galant", "keywords": "Human Computer Interaction\nVirtual Reality\nUsability Testing\nHealthcare training\nSelf-efficacy\nUser experience\nPresence\nCognitive load\nSimulation-based learning", "abstract": "Mass casualty incidents (MCIs) are high-risk situations\nrequiring rapid triage, prioritisation, and coordinated\ndecision-making under pressure. Virtual reality (VR) offers\nnew opportunities to design immersive training environments\nfor such contexts, but its effectiveness depends on the\nbalance between immersion, usability, and cognitive demands.\nThis exploratory study investigates how an immersive VR\ntraining system (SimTriage) affects self-efficacy, user\nexperience, presence, flow, and cognitive workload. Using a\nmulti-method psychometric framework (SEP MCI, EduFlow2,\nUEQ, SUS, PSQ, NASA-TLX), data were collected from 20\nparticipants.\nResults show a significant increase in self-efficacy\nfollowing system interaction (t(19) = −3.31, p = .002, d =\n0.74), alongside high levels of presence, cognitive\nengagement, and positive user experience, while maintaining\na moderate cognitive workload. However, substantial\ninter-individual variability in self-efficacy gains was\nobserved.\nThese findings suggest that training effectiveness in\nimmersive environments depends less on immersion alone than\non the alignment between interaction design, usability, and\ncognitive load. The study contributes to human–computer\ninteraction research by highlighting how experiential and\nusability factors jointly shape user outcomes in VR-based\ntraining systems.\n"}, {"id": 56, "type": "long", "title": "The Eyes Don’t Lie: Detecting Cognitive Load in VR Assembly Training using Built-in Pupillometry", "authors": "Anouk Michiels, Eva Geurts and Gustavo Rovelo Ruiz", "keywords": "Virtual Reality\nAdaptive Learning\nCognitive load\nEye-tracking\nWell-being\nIndustry 5.0\nManufacturing\nUser-centered design", "abstract": "Careful design of Virtual reality (VR) training is\nnecessary to optimize knowledge retention while avoiding\nexcessive mental strain. In this context, personalized\nlearning trajectories represent a key strategy by\ndynamically addressing individual needs, such as adapting\nthe pace, content or level of guidance. In such\ntrajectories, cognitive load metrics provide a reliable\nindicator of perceived task difficulty, serving as a\ntrigger to adjust the training parameters accordingly.\nHowever, current cognitive load assessment methods are\noften intrusive or limited to post-hoc subjective\nmeasurements. Therefore, we  whether pupillary responses\ncaptured by built-in eye-tracking sensors reflect cognitive\nload. Using a comparative experimental design, we\nmanipulated task difficulty through varying assistance\nlevels in a VR assembly training to compare pupillary\nresponses against subjective workload differences confirmed\nby the NASA-TLX. The results of our study demonstrate a\nclear convergence between subjective workload and objective\nphysiological data: increased perceived mental effort was\nmirrored by significant pupil dilation, while a decrease\nled to pupil constriction. These findings support the\nfeasibility of built-in pupillometry for cognitive workload\ndetection and provide a necessary step toward adaptive VR\ntraining systems that respond to the trainee's cognitive\nstate in real time."}, {"id": 59, "type": "long", "title": "Experimental Verification of Operator Reliability in Standardised Control Panel Operation Using Eye Tracking in Virtual Reality", "authors": "Zdeněk Tůma and Lubos Kotek", "keywords": "Operator reliability\neye tracking\nvirtual reality\ncontrol panel\nhuman error\ncognitive ergonomics", "abstract": "Operator reliability in safety-critical human-machine\nsystems has been studied extensively for conventional\nmanual controls, while hands-free input modalities, in\nparticular gaze-based selection in head-mounted virtual\nreality, remain underrepresented in quantitative\nreliability data. Recent industrial training simulators\nrely on immersive virtual environments to teach operators\nprocedures that would otherwise expose them to hazards, yet\nthe input modality used to confirm panel-level decisions is\nstill typically a hand controller. Eye tracking integrated\ninto the head-mounted display offers a hands-free\nalternative whose ergonomic and reliability implications,\nespecially for the spatial arrangement of small button\narrays, have not been examined under the lens of\nestablished human reliability analysis.\nThe study reported here verifies experimentally whether the\nspatial arrangement of three buttons on a standardised\ncontrol panel, horizontal versus vertical, influences the\noperator error rate when the buttons are activated by gaze\nand dwell selection in immersive virtual reality. The work\ncontinues a series of experiments at our institute on human\nerror in virtual reality and on automated ergonomic\nevaluation of operator workplaces.\nTwenty participants will complete a balanced sequence of\ntrials in a head-mounted display equipped with binocular\neye tracking. On each trial a coloured stimulus appears on\nthe panel and the participant must direct the gaze at the\nmatching button for a fixed dwell period. Target angular\nsize and inter-button spacing follow recommendations from\nprevious gaze-interaction studies. The two panel layouts\nare presented in counterbalanced order to suppress practice\neffects.\nThe primary dependent variable is the operator error rate,\nwith errors classified according to the established\ntaxonomy of slips, lapses and mistakes. Secondary measures\ninclude the time from stimulus onset to dwell confirmation,\nthe distribution of fixations across the defined areas of\ninterest, and subjective workload reported on the NASA Task\nLoad Index. The error data will be interpreted within the\nframework of human reliability analysis to derive empirical\nhuman error probability values for gaze input in a virtual\ncontrol panel, allowing comparison with nominal values\nreported for conventional manual controls. A discussion\nwill address the implications for stimulus-response\ncompatibility, given that the spatial code of the response\nset differs between the horizontal and the vertical layout.\nThe expected outcome is a quantitative comparison of the\ntwo panel layouts in terms of reliability, together with a\nfirst set of empirical reference values for human error\nprobability associated with gaze-based input in\nhead-mounted virtual reality. The findings should support\nevidence-based recommendations for the ergonomic design of\ngaze-controlled industrial interfaces used in immersive\ntraining and remote operation.\n"}, {"id": 42, "type": "long", "title": "Adaptive exposure therapy for Social Anxiety Disorder: a preliminary validation in virtual reality", "authors": "Sergio Frumento, Noemi Paparo, Martina Briglia, Matteo Martini, Manuela Chessa, Alberto Greco and Danilo Menicucci", "keywords": "social anxiety\nexposure therapy\ndesensitization\nvirtual reality\nadaptive scenario\nadaptive VR", "abstract": "Social Anxiety Disorder (SAD) represents an increasing\nchallenge for healthcare. Exposure therapy is the elective\ntreatment that has undergone significant development over\nlast decades thanks to Virtual Reality (VR): its last\nfrontier is represented by adaptive scenarios changing in\nreal time to maximize efficacy and tolerability of the\nexposure. In the present study, 15 volunteers with clinical\nSAD symptomatology were immersed in two versions of the\nsame virtual waiting room and asked to continuously report\ntheir anxiety in real time using the VR controller. One\nscenario gradually filled with avatars interacting with the\nparticipant in a fixed progression independent of the\nparticipant’s responses; the other automatically adapted\nthe avatars' number and behavior to induce more-or-less\nanxiety. Participants were not aware that, in the latter\nscenario, their ratings modulated the environment to\nmaintain participants within an optimal range of social\nanxiety: sufficiently elevated to promote therapeutic\nhabituation, yet low enough to minimize dropout. The\ncurrent findings indicate that the adaptive condition\nsuccessfully constrained anxiety within this target range:\nwhile preliminary, these results encourage further\ninvestigation to fully establish therapeutic efficacy."}]}, "track": "A"}, {"title": "Motivation, Mindset and Cognitive Design in Learning Technologies", "kind": "session", "session": {"title": "Motivation, Mindset and Cognitive Design in Learning Technologies", "papers": [{"id": 18, "type": "long", "title": "Designing Growth Mindset-Inspired Feedback Messages Tailored to Learning Behaviors Using LLM and Persuasive Strategies", "authors": "Mehnuma Tabassum Omar, Parham Moradi, Ogoti Sasha and Julita Vassileva", "keywords": "Growth Mindset\nPersuasive Strategy\nLarge Language Model (LLM)\nE-learning.", "abstract": "Encouraging effort and persistence over performance is the\ncore principle of a growth mindset, which can be useful in\nsustaining engagement in e-learning. One way to promote a\ngrowth mindset is to provide effective feedback to\nstudents. To contribute to this area, we introduce a\nfour-part feedback message structure (tone-setter,\nhighlight, suggestion, and mindset cues) inspired by the\ngrowth mindset principle, which encourages students to\nreflect, persist, and embrace challenges. The messages are\ntailored to learners' behaviors, formed by persuasive\nstrategies, and generated using a Large Language Model\n(LLM). To evaluate this structure, we conducted a small\nstudy with 15 instructors who reviewed and rated the\nfeedback messages to identify the strengths and areas for\nrefinement. The results indicate that instructors approved\nthe motivational intent of the messages but recommended\nrefining the structure and simplifying the language. These\nfindings offer useful insights that can guide the use of\nLLMs in developing motivational feedback systems tailored\nto learning behavior. The study provides an initial\nfoundation for explainable, rule-based feedback generation\nthat can be extended through experimentation with learners\nto assess the messages’ influence on their earning\nbehaviors, to increase the personalization of the messages\nto the learner’s persuadability, and their adaptivity to\ndynamic learning contexts."}, {"id": 31, "type": "long", "title": "Modeling Learning Practices Informed by Mindset Theory for Adaptive Educational Systems", "authors": "Mehnuma Tabassum Omar, Nafisul Kiron and Julita Vassileva", "keywords": "Mindset Theory\nAdaptive System\nLearner Modeling\nLog data", "abstract": "Dweck's Mindset Theory has been widely used to explain how\nlearners approach challenges and effort; yet, applying this\ntheory to guide pedagogical feedback in adaptive\neducational systems remains challenging. Learners' mindset\nbeliefs are often inferred from self-reports, which may not\nconsistently reflect how learners act during learning\nactivities, particularly across different contexts.\nMoreover, commonly used indicators such as participation or\nengagement primarily capture how much learners interact\nwith a system but provide limited insight into how learners\nrespond to challenge, distribute effort, or persist during\npractice, key constructs of mindset theory. We propose a\nbehavioral model of learning practice inspired by the core\nconstructs of Dweck's theory at the level of observable\nlearning practice. A model at this level of granularity can\nguide pedagogical responses to learners' behaviours during\ntheir use of a learning system, without relying on a\ngeneral mindset category derived from self-reported beliefs\nin a questionnaire. Our model is derived from interaction\nlogs in a quiz-based, gamified programming practice\nenvironment and characterizes practice patterns along\nobservable dimensions, including challenge diversity,\neffort distribution, persistence, and contribution. These\ndimensions are used to describe four practice types\ninspired by the mindset theory (Strong Fixed Practice,\nMostly fixed Some growth practice, Mostly Growth Some Fixed\npractice, and Strong Growth Practice). This typology\nremains at the behavioral level and does not claim to infer\nlearners' underlying mindset beliefs. We show that these\npractice types are associated with distinct participation\npatterns that extend beyond engagement. We discuss how\nmodeling learning practice in this way can support the\nchoice of pedagogical interventions of adaptive educational\nsystems grounded in mindset theory."}, {"id": 29, "type": "long", "title": "From Psychological Need Satisfaction to AI Dependency: The Divergent Roles of Basic and AI-Specific Needs", "authors": "Oronzo Parlangeli, Francesco Currò, Margherita Bracci, Enrica Marchigiani, Lorenzo Reina and Paola Palmitesta", "keywords": "AI use\nAI dependency\nBasic Psychological Needs\nAutonomy\nCompetence\nRelatedness\nSelf-Determination Theory\nSDT", "abstract": "The rapid diffusion of Artificial Intelligence (AI) is\ntransforming everyday practices, raising concerns about\nemerging forms of excessive use and technological\ndependency. The present study, based on an online\nquestionnaire with 306 participants aged 18–30, examined\nhow the satisfaction of psychological needs relates to AI\ndependency. Drawing on Self-Determination Theory (SDT),\nneed satisfaction was assessed both in everyday life and in\nthe context of AI use, alongside a measure of AI\ndependency. Relationships among variables were examined\nusing Structural Equation Modelling (SEM). Results revealed\na contrasting pattern: basic psychological need\nsatisfaction was negatively associated with AI dependency,\nwhereas AI-specific need satisfaction showed a strong\npositive association. These findings suggest that\ngenerative AI may function not only as a compensatory\nresource for unmet needs, but also as a primary context for\nneed satisfaction, thereby reinforcing dependency-related\npatterns of use. Contrary to expectations, the association\nbetween basic and AI-specific needs was weak, indicating\nthat the two constructs operate as partially independent\nprocesses. Overall, the findings highlight the importance\nof distinguishing between basic and context-specific need\nsatisfaction in understanding the psychological mechanisms\nunderlying AI dependency."}, {"id": 52, "type": "long", "title": "Externalization by Design: Cognitive Load, Bounded AI, and Process-Level Accountability in Expert Knowledge Systems", "authors": "Iren Irbe", "keywords": "tacit knowledge externalization\ncognitive load theory\nEASCI\ngenerative AI governance\ncognitive forcing functions\nprocess-level explainability\nknowledge management\nhuman-AI collaboration", "abstract": "Tacit knowledge externalization fails in two ways.\nCognitively, practitioners are often asked to recall,\norganize, and present expert reasoning at once, which\noverloads working memory. The second failure is epistemic:\nwithout explicit governance, generative AI can introduce\nauthoritative-looking content without adequate validation,\nprovenance, or scrutiny.\n\nThis paper presents EASCI\n(Experience–Articulation–Structuring–Consolidation–Innovation),\na five-stage architecture that separates cognitive tasks\nand constrains AI participation. Three design interventions\nreduce the working-memory bottleneck: stage separation,\nmodality-sensitive capture, and a counter-hypothesis\nmechanism. Seven design principles, five constraints, a\nprocess-level explainability layer, and eleven feedback\npaths prevent AI outputs from gaining authority without\nhuman validation, thereby making the lifecycle auditable.\n\nThe framework was developed through design science\nresearch, including a scoping review, practitioner\ninterviews, and participatory workshops. Its structural\nproperties have been formally verified in Lean~4, while the\nquantitative evaluation is ongoing."}]}, "track": "B"}]}, {"start": "15:30", "end": "17:00", "tracks": [{"title": "General Assembly", "kind": "event"}]
