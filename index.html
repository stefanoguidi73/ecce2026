<!DOCTYPE html>

<head>

<title>ECCE 2026 — Programma</title>

<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111111;
    --paper:#FFFFFF;
    --panel:#F4F4F4;
    --line:#E2E2E2;
    --muted:#6B6B6B;
    --card:#FBFBFB;
    /* gradient lifted from the official ECCE 2026 logo */
    --g-orange:#E6873A;
    --g-pink:#CB648A;
    --g-purple:#A985B2;
    --g-blue:#83C1DF;
    --g-green:#50AE62;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    line-height:1.45;
    padding-bottom:48px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  /* ---- gradient rule, lifted straight from the logo mark ---- */
  .gradient-rule{
    height:5px;
    background:linear-gradient(90deg, var(--g-orange), var(--g-pink), var(--g-purple), var(--g-blue), var(--g-green));
  }

  .stickywrap{ position:sticky; top:0; z-index:20; }

  header.top{
    background:var(--paper);
    color:var(--ink);
    padding:14px 18px 0 18px;
    border-bottom:1px solid var(--line);
  }
  header.top .brand{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  header.top .brand img{ height:34px; width:auto; display:block; }
  header.top .brand .braintext{ display:flex; flex-direction:column; }
  header.top .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0;
  }
  header.top h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:20px;
    margin:0;
    letter-spacing:-0.01em;
  }

  .tabstrip{
    display:flex;
    gap:2px;
    padding-top:4px;
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .tabstrip::-webkit-scrollbar{ display:none; }
  .daytab{
    flex:1 1 0;
    min-width:46px;
    text-align:center;
    padding:10px 10px 10px 10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--muted);
    background:transparent;
    border:none;
    border-bottom:3px solid transparent;
    cursor:pointer;
    white-space:nowrap;
  }
  .daytab .d{ font-size:17px; font-weight:600; display:block; color:var(--ink);}
  .daytab.active{ border-bottom:3px solid var(--g-pink); color:var(--g-pink);}
  .daytab.active .d{ color:var(--g-pink); }

  .searchwrap{
    padding:12px 18px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .searchwrap input{
    width:100%;
    padding:10px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  .searchwrap input:focus{ outline:2px solid var(--sienna-soft); outline-offset:1px; }
  .searchmeta{ font-size:11.5px; color:var(--muted); margin-top:6px; font-family:'IBM Plex Mono', monospace; min-height:14px;}

  main{ padding:6px 18px 24px 18px; }

  .block{ display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); }
  .block .time{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--muted);
    width:44px;
    flex-shrink:0;
    padding-top:4px;
  }
  .block .time span{ display:block; }
  .tracks{ flex:1; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .tracks.two{ flex-direction:row; }
  .tracks.two > .card{ flex:1; min-width:0; }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
  }
  .card.event{ background:transparent; border:none; padding:4px 0 4px 0; }
  .card.event .label{ font-size:13.5px; color:var(--muted); font-style:italic; }
  .card.keynote{ border-left:3px solid var(--g-purple); background:var(--panel); }
  .card.keynote .label{ color:var(--ink); font-weight:600; font-size:13.5px; font-style:normal; }
  .card.keynote .label::before{ content:"✦ "; color:var(--g-purple); }

  .card.workshop{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--g-orange);
    border-radius:10px;
    padding:14px 14px;
  }
  .card.workshop .wtitle{ font-family:'Fraunces', serif; font-weight:600; font-size:16px; margin:0 0 6px 0; }
  .card.workshop .wmeta{ font-size:12.5px; color:var(--muted); margin:2px 0; }
  .card.workshop .wbadge{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    text-transform:uppercase; letter-spacing:.06em; color:var(--g-orange);
    border:1px solid var(--g-orange); border-radius:4px; padding:2px 6px; margin-top:6px;
  }

  .card.session{ cursor:pointer; }
  .card.session .tracklabel{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--accent, var(--g-pink));
    text-transform:uppercase;
    letter-spacing:.08em;
    margin-bottom:2px;
  }
  .card.session{ border-left:3px solid var(--accent, var(--g-pink)); }
  .card.session h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15.5px;
    margin:0 0 4px 0;
    line-height:1.25;
  }
  .card.session .count{ font-size:11.5px; color:var(--muted); }
  .card.session .savedcount{
    font-size:11px; color:var(--g-orange); font-weight:600;
    margin-left:6px;
  }
  .card.session .chev{ float:right; color:var(--muted); font-size:12px; }

  .paperlist{ margin-top:8px; display:none; }
  .paperlist.open{ display:block; }
  .paper{ padding:9px 0; border-top:1px dashed var(--line); }
  .paper:first-child{ border-top:1px solid var(--line); margin-top:6px; }
  .paper .ptop{ display:flex; gap:6px; align-items:baseline; flex-wrap:wrap; }
  .paper .ptop{ display:flex; gap:6px; align-items:baseline; flex-wrap:wrap; justify-content:space-between; }
  .paper .ptopleft{ display:flex; gap:6px; align-items:baseline; flex-wrap:wrap; }
  .paper .ptopright{ display:flex; gap:8px; align-items:center; }
  .bookmark{
    border:none; background:none; cursor:pointer; font-size:16px; line-height:1;
    color:var(--line); padding:0 2px;
  }
  .bookmark.on{ color:var(--g-orange); }
  .calbtn{
    border:none; background:none; cursor:pointer; font-size:14px; line-height:1;
    color:var(--muted); padding:0 2px; opacity:.7;
  }
  .calbtn:hover{ opacity:1; }
  .card.workshop .wtop{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .card.event.keynote{ display:flex; align-items:center; justify-content:space-between; gap:8px; }

  .mineitem-ctx{ font-size:11px; color:var(--muted); font-family:'IBM Plex Mono', monospace; margin-bottom:2px; }

  .notewrap{ margin-top:8px; }
  .notewrap label{ display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:3px; font-family:'IBM Plex Mono', monospace; }
  .notewrap textarea{
    width:100%; min-height:56px; resize:vertical;
    font-family:'IBM Plex Sans', sans-serif; font-size:13px;
    border:1px solid var(--line); border-radius:6px; padding:6px 8px;
    background:#fff; color:var(--ink);
  }
  .notewrap textarea:focus{ outline:2px solid var(--g-purple); outline-offset:1px; }
  .savedhint{ font-size:10px; color:var(--muted); margin-top:3px; visibility:hidden; }
  .savedhint.show{ visibility:visible; }

  .paper .pid{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--g-pink); }
  .paper .ptype{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    text-transform:uppercase;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:4px;
    padding:1px 5px;
  }
  .paper .ptitle{ font-weight:500; font-size:13.5px; margin:3px 0 2px 0; }
  .paper .pauthors{ font-size:12px; color:var(--muted); }
  .prow{ display:flex; align-items:center; gap:8px; margin-top:4px; }
  .paper .pmore{ font-size:11.5px; color:var(--g-pink); margin-top:0; cursor:pointer; text-decoration:underline; text-decoration-color:var(--line); }
  .noteicon{
    font-size:13px; color:var(--line); line-height:1; cursor:pointer;
    transition:color .15s;
  }
  .noteicon.on{ color:var(--g-orange); }
  .paper .pdetail{ display:none; font-size:12.5px; margin-top:6px; color:#3a3a3a; background:var(--panel); border-radius:6px; padding:8px 10px; }
  .paper .pdetail.open{ display:block; }
  .paper .pdetail .kw{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); margin-top:6px; }

  mark{ background:#FBE3C0; color:inherit; border-radius:2px; }

  h2.daytitle{
    font-family:'Fraunces', serif;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--muted);
    margin:18px 0 4px 0;
  }

  .reserve{
    margin-top:26px;
    padding-top:16px;
  }
  .reserve h2{
    font-family:'Fraunces', serif;
    font-size:16px;
    margin:0 0 8px 0;
  }
  .reserve p.note{ font-size:12px; color:var(--muted); margin:0 0 10px 0;}

  .venue-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    margin-bottom:12px;
  }
  .venue-card h3{
    font-family:'Fraunces', serif;
    font-size:16px;
    margin:0 0 2px 0;
  }
  .venue-card .vaddr{ font-size:12px; color:var(--muted); margin-bottom:8px; }
  .venue-card .vnote{
    font-size:11.5px; font-style:italic; color:var(--g-orange);
    margin-bottom:8px;
  }
  .venue-card .vwhen{ font-size:13px; margin:4px 0; padding-left:14px; position:relative; }
  .venue-card .vwhen::before{ content:"•"; position:absolute; left:0; color:var(--g-pink); }
  .venue-card .vwhen b{ font-weight:600; }

  .mapwrap{ margin-top:16px; }
  .maptoolbar{ display:flex; justify-content:flex-end; margin-bottom:6px; }
  .maptoolbar button{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:5px 10px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
  }
  .maptoolbar button.on{ background:var(--g-pink); color:#fff; border-color:var(--g-pink); }
  #leaflet-map{
    width:100%;
    height:340px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--panel);
  }
  .map-note{ font-size:11px; color:var(--muted); margin-top:6px; }

  .notes-download{ margin-bottom:14px; }
  .notes-download button{
    width:100%;
    padding:10px 14px;
    border-radius:8px;
    border:1px solid var(--g-orange);
    background:var(--panel);
    color:var(--g-orange);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }

  .empty{ text-align:center; padding:40px 20px; color:var(--muted); font-size:13.5px; }
  .empty .big{ font-size:28px; display:block; margin-bottom:8px; }

  footer{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    padding:18px;
  }
</style>
</head>
<body>

<div class="stickywrap">
  <header class="top">
    <div class="brand">
      <img src="ecce-logo.png" alt="ECCE 2026 logo">
    </div>
    <p class="eyebrow">Siena, Italy · September 2026</p>
    <div class="tabstrip" id="tabstrip"></div>
  </header>
  <div class="gradient-rule"></div>

  <div class="searchwrap">
    <input type="text" id="search" placeholder="Search by title, author or keyword…" autocomplete="off">
    <div class="searchmeta" id="searchmeta"></div>
  </div>
</div>

<main id="main"></main>

<footer>ECCE 2026 — programme subject to change</footer>

<script id="program-data" type="application/json">{"agenda": {"15": [{"start": "14:30", "end": "17:30", "tracks": [{"title": "1st ECCE Workshop on Cognition and Large Language Models", "kind": "workshop"}]}, {"start": "17:30", "end": "18:00", "tracks": [{"title": "Welcome reception", "kind": "event"}]}], "16": [{"start": "09:30", "end": "10:00", "tracks": [{"title": "Registration", "kind": "event"}]}, {"start": "10:00", "end": "11:00", "tracks": [{"title": "Keynote — Agnieszka Wykowska", "kind": "keynote"}]}, {"start": "11:00", "end": "11:30", "tracks": [{"title": "Coffee break", "kind": "break"}]}, {"start": "11:30", "end": "13:00", "tracks": [{"title": "Training, Learning and Simulation Technologies", "kind": "session", "session": {"title": "Training, Learning and Simulation Technologies", "papers": [{"id": 18, "type": "long", "title": "Designing Growth Mindset-Inspired Feedback Messages Tailored to Learning Behaviors Using LLM and Persuasive Strategies", "authors": "Mehnuma Tabassum Omar, Parham Moradi, Ogoti Sasha and\nJulita Vassileva", "keywords": "Growth Mindset\nPersuasive Strategy\nLarge Language Model (LLM)\nE-learning.", "abstract": "Encouraging effort and persistence over performance is the core principle of a growth mindset, which can be useful in sustaining engagement in e-learning. One way to promote a growth mindset is to provide effective feedback to students. To contribute to this area, we introduce a four-part feedback message structure (tone-setter, highlight, suggestion, and growth-mindset) inspired by the growth mindset principle, which encourages students to reflect, persist, and embrace challenges. The messages are tailored to learners’ behaviors, formed by persuasive strategies, and generated using a Large Language Model (LLM). To evaluate this structure, we conducted a small study with 19 instructors who reviewed and rated the feedback messages to identify the strengths and areas for refinement. The results indicate that instructors approved the motivational intent of the messages but recommended refining the structure and simplifying the language. These findings offer useful insights that can guide the use of LLMs in developing motivational feedback systems tailored to learning behavior. The study provides an initial foundation for explainable, rule-based feedback generation that can be extended through experimentation with learners to assess the messages’ influence on their learning behaviors, to increase the personalization of the messages to the learner's persuadability, and their adaptivity to dynamic learning contexts."}, {"id": 31, "type": "long", "title": "Modeling Learning Practices Informed by Mindset Theory for Adaptive Educational Systems", "authors": "Mehnuma Tabassum Omar, Nafisul Kiron and Julita Vassileva", "keywords": "Mindset Theory\nAdaptive System\nLearner Modeling\nLog data", "abstract": "Dweck's Mindset Theory has been widely used to explain how learners approach challenges and effort; yet, applying this theory to guide pedagogical feedback in adaptive educational systems remains challenging. Learners’ mindset beliefs are often inferred from self-reports or survey-based reports, which may not consistently reflect how learners act during learning activities, particularly across different contexts. Moreover, commonly used indicators such as participation or engagement primarily capture how much learners interact with a system but provide limited insight into how learners respond to challenge, distribute effort, or persist during practice, key constructs of mindset theory. We propose a behavioral model of learning practice inspired by the core constructs of Dweck's theory at the level of observable learning practice. Such a model can support adaptive educational support by using learners’ observed learning practices rather than relying solely on survey-reported mindset. Our model is derived from interaction logs in a quiz-based, gamified programming practice environment and characterizes practice patterns along observable dimensions, including challenge diversity, effort distribution, persistence, and contribution. These dimensions are used to describe four practice types inspired by the mindset theory (Strong Fixed Practice, Fixed–Growth Practice, Growth–Fixed Practice and Strong Growth Practice). This typology remains at the behavioral level and does not claim to infer learners’ underlying mindset beliefs. We show that these practice types are associated with distinct participation patterns that extend beyond engagement. We discuss how modeling learning practice in this way can support the choice of pedagogical interventions of adaptive educational systems grounded in mindset theory."}, {"id": 55, "type": "long", "title": "Clean or simplistic? Testing a lower granularity algorithmic explainer for users’ comprehension, trust, and preference", "authors": "Anna Spagnolli, Elena Capuozzo, Valentina Zaccaria, Olivia\nCasadei, Suleyman Ozturk, Idil Akyurt, Arianna Stropeni and\nGian Antonio Susto", "keywords": "explainable AI\nvisual explanations\ntrust\nuser-based assessment", "abstract": "The growing demand to reduce the opacity of algorithmic systems has led to the development of numerous Explainable Artificial Intelligence (XAI) methodologies that provide clear and coherent explanations for specific algorithmic predictions. In several real-life domains, the need for rapid explanation motivates the use of models, such as AcME (Accelerated Model-agnostic Explanations), that significantly improve time efficiency in both computation and comprehension compared with reference models. However, the lower granularity of their output visualizations can be perceived as simplistic, negatively impacting their perceived trustworthiness among experts. In this study, we evaluated AcME against a benchmark explainer (SHAP, SHapley Additive exPlanation) for users’ comprehension, trust and preference. We conducted two studies with expert users (N = 146) and collected both quantitative and qualitative data via the Qualtrics survey platform. The results suggest that AcME's explanations are understood, and their lower granularity does not compromise their trustworthiness relative to the benchmark. Furthermore, users’ preferences split evenly between the two methods, with AcME preferred for its clean layout and SHAP for its rich information."}, {"id": 9, "type": "wip", "title": "Robot assistants during high mental workload: Understanding Task-Specific Load in Human–Robot Interaction", "authors": "Valentina Cesari, Jacopo Elettari and Agnieszka Wykowska", "keywords": "human-robot interaction\ncognitive ergonomics\ncognitive offloading\nmental workload", "abstract": "Cognitive offloading refers to the redistribution of task demands with the aim of reducing an individual's mental workload. A promising strategy in this domain involves leveraging robotic agents, whether humanoid or non-humanoid, to support such task redistribution. However, this process is not straightforward, as the effectiveness of a robot as an offloading agent critically depends on identifying the specific type of mental workload experienced by the user. Mental workload is a multidimensional construct that includes demands on perception, working memory, and executive functions; therefore, accurately characterizing the type of load during task execution is essential for designing effective offloading strategies. Importantly, this characterization alone is not sufficient, as it is equally necessary to identify the specific stage of the task that is most sensitive to workload fluctuations, since the benefits of offloading may depend on when support is provided. To address this challenge, we propose three experiments aimed at identifying mechanism-specific markers of workload and evaluating robot-assisted cognitive offloading. The first experiment focuses on perceptual load using a visual search paradigm with physical objects, building on preliminary data collected in a human-only condition and extending the task by introducing a robotic assistant to support performance during task execution. The second and third experiments investigate working memory load through a sequential recall task. The second experiment identifies neural markers of working memory load, and the third introduces robot-assisted offloading. Across all experiments, neural activity measured through electroencephalography (EEG), behavioral performance, and subjective workload will be assessed. By contrasting high- and low-load conditions and comparing human-only and robot-assisted performance, this work aims to inform the design of stage-specific robotic assistance tailored to distinct cognitive demands."}, {"id": 17, "type": "wip", "title": "Towards Intelligent Virtual Agents for Visual Monitoring of Assembly Tasks", "authors": "Sofie Magdalena Schwenkreis, Vera Marie Memmesheimer and\nAchim Ebert", "keywords": "Intelligent Virtual Agents\nEmbodiment\nVisual Monitoring\nAssembly Task\nApple Vision Pro", "abstract": "Manual assembly is essential in domains of high tactile complexity and product variability such as aircraft manufacturing, automotive assembly lines, or at-home furniture construction. Here, agentic artificial intelligence (AI) is deployed to visually monitor the assembly process and offer varying levels of support. At the same time, assembly tasks may benefit from the application of Mixed Reality (MR) which seamlessly integrates virtual elements in the physical space. Combining AI and MR allows a fundamental transformation of visual monitoring systems in assembly tasks and opens a vast, underexplored design space for intelligent virtual agents (IVAs). In this paper, we begin to systematically navigate and structure this space. To this end, we developed a MR prototype for the Apple Vision Pro featuring two contrasting virtual agent representations, one abstract and one humanoid, which provide assistance in two assembly tasks. Semi-structured expert interviews reveal two opposing preferences: while some experts favored the abstract agent's ability to transparently signal its machine-based logic, others perceived the humanoid agent as more natural. These preliminary findings suggest that a one-size-fits-all approach to agent design – which is often pursued – may be insufficient. Moving forward, we aim to investigate adaptable agent representations that can be dynamically tailored to user preferences and special task requirements."}]}, "track": "A"}, {"title": "Mobility, Autonomous Vehicles and Collaborative Design", "kind": "session", "session": {"title": "Mobility, Autonomous Vehicles and Collaborative Design", "papers": [{"id": 8, "type": "long", "title": "Human behavior facing a vehicle in shared spaces: investigating the relation between action and perception", "authors": "Lydie Baillard, Sandrine Caroly, Manon Prédhumeau and Julie\nDugdale", "keywords": "Ergonomics\nPedestrians\nVulnerable road users\nInteractions", "abstract": "Autonomous vehicles will have to interact safely with pedestrians when integrated into cities. Some urban areas have adopted the shared space concept, where road users interact closely without explicit rules and across multiple directions. Observing pedestrian behavior in shared spaces with conventional vehicles provides insight into how autonomous vehicles can be effectively integrated into such spaces. However, studies of interactions between vehicles and pedestrians often lack shared space data and mostly focus on the crossing scenario. In this paper, we conducted observations of pedestrian interactions with vehicles in a shared space and categorized behaviors based on gaze, movement, gestures, and oral communication. We propose gaze and trajectory deviations as representative of information treatment by pedestrians, linking perception and action, and compare different interaction types. We also noted some trajectory deviations and protective behaviors in pedestrian groups. Finally, our observations suggest that hand gesture detection should not be a top priority in autonomous vehicle design."}, {"id": 47, "type": "long", "title": "Cultural Orientation Shapes Moral Judgments of Autonomous Vehicle Dilemmas", "authors": "Eda Isil Sukan, Augusto Bovesi and Stefano Guidi", "keywords": "Autonomous Vehicles\nMoral Decision-Making\nCultural Orientation\nPassenger-Pedestrian Dilemma\nFraming Effects", "abstract": "Autonomous vehicles (AVs) promise enhanced road safety but face acceptance challenges due to unavoidable moral dilemmas, particularly passenger-pedestrian conflicts. Cultural orientation may influence moral evaluations of AV decisions, yet its effects remain underexplored. Here we conducted an online survey with 346 participants from individualistic (US, Italy) and collectivistic (Turkey, Indonesia) cultures, manipulating the number of lives at stake. Results revealed a modest overall preference for pedestrian-protective choices, modulated by contextual factors and cultural orientation, with collectivist individuals favoring pedestrian protection more. These findings suggest that to enhance public acceptance, AV technologies should be designed with different moral preferences depending on the cultural context in which they have to be used."}, {"id": 24, "type": "long", "title": "Towards Urban Air Mobility: Exploring how to support collaborative planning and communication in drone projects", "authors": "Jekaterina Basjuka, Jonas Löwgren, Carl Westin and Jonas\nLundberg", "keywords": "Collaborative planning\nCommunication\nUAM\nStorytelling\nDrone\nCo-design", "abstract": "As drones become integrated into urban contexts, stakeholders such as city planners and drone operators must collaborate to plan, regulate, and execute operations. However, many lack a shared understanding of drone capabilities, regulatory processes, and planning requirements, leading to coordination challenges. This paper presents an exploratory investigation of two prototypes supporting collaborative drone work: a Planning Platform for structuring multi-stakeholder planning and a Library of Explanatory Stories for communicating foundational concepts. Developed through iterative engagement with an expert drone operator and evaluated with municipality representatives and drone operator trainees, the findings indicate that structured visual planning supports coordination, risk awareness, and shared reference points, while storytelling aids initial understanding. At the same time, challenges related to digital literacy, organizational integration, narrative simplification, and visual credibility were identified. The paper contributes both the design of these prototypes and a set of design principles for structuring interaction and translating complex domain knowledge to support shared understanding in multi-stakeholder drone work."}, {"id": 4, "type": "short", "title": "Visual Storytelling for Knowledge Sharing in Co-Design Workshops on Urban Air Mobility", "authors": "Jekaterina Basjuka, Carl Westin and Jonas Lundberg", "keywords": "visual storytelling\nco-design\nUAM\ndrone\nsimulation\nknowledge sharing", "abstract": "Realizing Urban Air Mobility as a transportation system requires cities to collaboratively plan uncertain futures with stakeholders who hold diverse expertise and priorities. Co-design workshops and simulations can support this, but the contextual reasoning emerging from discussions is typically lost to fragmented notes, creating a gap between what simulations show and what stakeholders know. This study explores an Interactive Storytelling Tool that combines drone traffic simulation with narrative video triggers to preserve and communicate stakeholder reasoning across workshops. Short narrative segments embedded in the simulation encode stakeholder insights from one workshop and replay them for subsequent regional groups. Tested across five workshops in four Swedish regions, findings suggest the approach helped surface domain challenges such as regulatory uncertainty and infrastructure ownership that simulation alone cannot capture. However, the study also revealed that groups at more advanced stages of UAM development tended toward solution-focused discussions, and that differences in regional UAM familiarity affected engagement with stories generated in previous workshops, pointing to the importance of workshop sequencing and facilitation in future iterations."}, {"id": 44, "type": "wip", "title": "Design through counterfactual theatre: an embodied simulation method for designing digital social touch", "authors": "Robin Héron, Stéphane Safin, Michael Baker and Françoise\nDétienne", "keywords": "Design\nActivity\nErgonomics\nTheatre\nSimulation\nCreativity", "abstract": "When designing the future, activity analysis has long been fruitful. Several research however point out the limit of analysing current processes for accurately envisioning newly designed tools and environments. To address this, the simulation of the future activity through mock-ups, scenarios, games, or even theatre, is a go-to design method. In most cases, designers are outside of the simulation, observing, commenting, directing what participants are doing. When the object of design involves strong bodily sensations as in the case of touch, a deeper integration of designers in embodied simulation could lead to increased creativity while keeping a foot in real life. In this paper, we explore a design method combining embodied activity simulation through improvisation theatre and counterfactual history to support creativity in simulated use context. For that purpose, we first organised 4 short creativity workshops to test out counterfactual history scenarios and refine a protocol method. In a second phase, 6 similarly structured creativity workshops were implemented, each counting 4 to 5 participants, where participants were asked to design social touch solutions and simulate their use in improvised scenes following a scenario based on the Covid-19 pandemic. This article focuses on the method and its evaluation, our objective being to explore whether participants are able to design through the embodied simulation of their activity. For this, we focus on the analysis of three of our variables: phases (design, simulation or both), solutions (the different ideas discussed and simulated) and functions (the touch functions supported by the solutions). Our results suggest that our proposed design method enables participants to generate and refine solutions that take into account the context of use and are rooted in their own lived experiences."}]}, "track": "B"}]}, {"start": "13:00", "end": "14:00", "tracks": [{"title": "Lunch", "kind": "break"}]}, {"start": "14:00", "end": "14:30", "tracks": [{"title": "Poster presentations", "kind": "event"}]}, {"start": "14:30", "end": "15:00", "tracks": [{"title": "Poster exhibition", "kind": "event"}]}, {"start": "15:00", "end": "17:00", "tracks": [{"title": "Psychological Wellbeing and Behavioural Health", "kind": "session", "session": {"title": "Psychological Wellbeing and Behavioural Health", "papers": [{"id": 26, "type": "long", "title": "Employer organisations and counsellor attitudes towards digital interventions for mental health and wellbeing within the workplace: A qualitative analysis", "authors": "Gillian Cameron, Maurice Mulvenna, Edel Ennis, Raymond\nBond, Siobhan O'Neill and David Cameron", "keywords": "mental health\ndigital mental health\nworkplace wellbeing\nrequirements gathering\nthematic analysis", "abstract": "Meaningful work supports employee wellbeing, yet mental health conditions remain common and contribute to substantial productivity loss. Digital mental health interventions (DMHIs) offer scalable support but vary widely in quality, personalisation, and integration into workplace systems. This study explored how employer organisations commissioning wellbeing services and counsellors delivering Employee Assistance Programmes (EAPs) perceive the role of DMHIs in workplace mental health. Semi‑structured interviews with 14 employers and 5 counsellors were analysed using thematic analysis. Both groups viewed DMHIs as most effective when embedded within broader wellbeing programmes that include traditional services such as counselling. Key barriers included text‑heavy content, poor navigation, limited personalisation, and a lack of robust evidence and outcome metrics. Enhanced integration, training, and alignment with evidence‑based therapeutic models were seen as essential to increase engagement and trust. Overall, DMHIs were considered valuable as part of a blended approach, though further work is needed to refine design requirements and understand how these tools can be most effectively incorporated into workplace wellbeing strategies. Collectively, these findings indicate that while many employer organisations and counsellors recognise the promise of DMHIs, successful adoption depends on overcoming practical barriers and aligning tools with organisational and client needs."}, {"id": 7, "type": "long", "title": "Symptoms matters: commonality and variability of gaming disorder symptoms across 35 countries", "authors": "Ala Yankouskaya, Mohamed Basel Almourad, Magnus Liebherr,\nJustin Thomas, Guandong Xu and Raian Ali", "keywords": "Gaming Disorder\nSymptom prevalence\nCross-national\nDiagnostic criteria", "abstract": "Gaming Disorder (GD) has attracted considerable academic attention. Yet, our understanding of the prevalence of this disorder at the symptom level and the hierarchy of the symptoms is limited. The current study seeks to clarify the symptom structure of GD by identifying which symptoms are most common, which are less frequently reported, whether the symptoms follow a hierarchical pattern, and how consistent this structure is across nationally and culturally diverse populations. Using data from a large-scale, cross-national survey conducted across 35 countries, we analysed prevalence and structure of the nine DSM-5 symptoms of GD in 24,733 gamers. To model symptom prevalence while accounting for sampling uncertainty and country-level heterogeneity, we used Bayesian multilevel logistic regression with partial pooling of country-specific estimates. Escape and Tolerance emerged as the most reported symptoms, while Conflict and Deception were the least endorsed. Yet the most frequently reported symptom, Escape, was also the least connected to the rest of the symptom network. A consistent cross-national hierarchy of symptoms was identified: Escape, Tolerance, and Displacement ranked highest in prevalence across nearly all countries, while Conflict and Deception ranked lowest. At the same time, countries varied systematically in their overall likelihood of endorsing GD symptoms. Our findings call for a re-evaluation of which symptoms are most diagnostically meaningful, and caution against applying uniform diagnostic thresholds across diverse populations."}, {"id": 42, "type": "long", "title": "Adaptive exposure therapy for Social Anxiety Disorder: a preliminary validation in virtual reality", "authors": "Sergio Frumento, Noemi Paparo, Martina Briglia, Matteo\nMartini, Manuela Chessa, Alberto Greco and Danilo Menicucci", "keywords": "social anxiety\nexposure therapy\ndesensitization\nvirtual reality\nadaptive scenario\nadaptive VR", "abstract": "Social Anxiety Disorder (SAD) represents an increasingly prevalent challenge for healthcare. Exposure therapy is the elective treatment that has undergone significant development over last decades thanks to Virtual Reality (VR): its last frontier is represented by adaptive scenarios changing in real time to maximize efficacy and tolerability of the exposure. In the present study, 15 volunteers with clinical SAD symptomatology were immersed in two versions of the same virtual waiting room and asked to continuously report their anxiety in real time using the VR controller. One scenario gradually filled with avatars interacting with the participant in a fixed progression independent of the participant's responses; the other automatically adapted the avatars’ number and behavior to induce more-or-less anxiety. Participants were not aware that, in the latter scenario, their ratings modulated the environment to maintain participants within an optimal range of social anxiety: sufficiently elevated to promote therapeutic habituation, yet low enough to minimize dropout. The current findings indicate that the adaptive condition successfully constrained anxiety within this target range: while preliminary, these results encourage further investigation to fully establish therapeutic efficacy."}, {"id": 10, "type": "short", "title": "Analyzing the Interest in Digital Wellbeing Services: Are People More Willing to Pay for Them on Social Network Sites or Messaging Platforms?", "authors": "Sameha Alshakhsi, Areej Babiker, Dena Al-Thani, Cornelia\nSindermann, Christian Montag and Raian Ali", "keywords": "Digital wellbeing\nData business model\nWillingness to pay\nPrivacy\nHealthy Usage\nFake news\nPlatform design\nUser preferences", "abstract": "The prevalence of social network sites (SNS) and messaging platforms (MSG) has transformed the way people communicate, interact, and share knowledge, leading to social transformations. However, concerns about digital wellbeing (DWB) have arisen due to issues such as personal data disclosure, extremism, fake news, excessive usage, and mental health challenges. From a cognitive ergonomics perspective, these challenges are shaped by platform design and user interaction patterns, influencing users’ attention, behavior, and overall digital experience, which highlights the need for user-centered design approaches. This study investigates how users value digital wellbeing and their willingness to pay (WTP) for DWB services across SNS and MSG, examining differences across demographic groups. The analysis includes age, gender, financial wellness, and education. Data were collected from 262 participants from European countries using an online questionnaire assessing ten DWB services. Overall, WTP was higher on SNS than MSG, with variations observed at the service level. Participants were more willing to pay on MSG for data protection and marketing purposes, while on SNS, they preferred services addressing fake news, radicalization, and excessive use. These preferences remained consistent across demographics. The findings highlight how users prioritize design interventions that support cognitive and behavioral regulation in digital environments. The results provide insights for designing ergonomically informed, user-centered digital wellbeing features and informing platform and policy strategies that promote healthier technology use."}, {"id": 20, "type": "short", "title": "The Fear of AI is the Fear of Looking in the Mirror: Low Trait Honesty-Humility Predicts Individual Perceived Likelihood of Future Apocalyptic AI Scenarios Through Beliefs in a Competitive World", "authors": "Enrico Cipriani, Danilo Menicucci and Simone Grassini", "keywords": "Artificial Intelligence\nAI anxiety\nAI narratives\nSocial Dominance Orientation\nDual-Process Model\nAnthropomorphism\nIndividual differences", "abstract": "Apocalyptic narratives about Artificial Intelligence (AI), in which a future superintelligence dominates or annihilates humanity, have become a prominent source of public anxiety and a central concern in the AI alignment discourse. Because the behavior of a hypothetical superintelligent AI is fundamentally unknowable, individual expectations about such scenarios may reflect projections of users’ own social worldviews and self-perceptions rather than grounded technological forecasts. Drawing on Duckitt's dual-process model of ideological attitudes, we tested whether Honesty-Humility, beliefs in a competitive world, and Social Dominance Orientation (SDO) predict the perceived likelihood of apocalyptic AI futures in a preregistered online survey of a representative UK sample (N = 300). Serial mediation analysis revealed that low trait Honesty-Humility indirectly predicted AI domination beliefs through competitive worldview, supporting a \"projection\" interpretation: individuals who perceive themselves as manipulative and exploitative expect the same of a hypothetical superintelligent AI. This effect is robust even after controlling for AI literacy, AI attitudes, AI use, and demographics. We discuss implications for understanding AI anthropomorphism, AI anxiety, and the socio-psychological roots of apocalyptic AI narratives."}]}}]}, {"start": "17:00", "end": "17:30", "tracks": [{"title": "Coffee break", "kind": "break"}]}, {"start": "18:00", "end": "19:00", "tracks": [{"title": "Keynote — Patrizia Marti (Santa Chiara)", "kind": "keynote"}]}, {"start": "19:00", "end": "19:30", "tracks": [{"title": "Welcome reception + ECRs welcome meeting", "kind": "event"}]}], "17": [{"start": "09:30", "end": "11:00", "tracks": [{"title": "Physical Health, Rehabilitation and Occupational Ergonomics", "kind": "session", "session": {"title": "Physical Health, Rehabilitation and Occupational Ergonomics", "papers": [{"id": 27, "type": "long", "title": "Embodying Conversational Agents in Paediatric Speech Therapy: A systematic review", "authors": "Alessia Nicoletta Marino, Liliana Vale Costa and Patrizia\nMarti", "keywords": "ECAs\nSpeech Therapy\nChildren\nReview", "abstract": "Language disorders in pediatric age affect not only linguistics, but also socio-educational dimensions. Despite its importance and advancements in using digital interventions to support speech therapy rehabilitation in its repetitive activities, there has been a knowledge gap in the systematization of the characteristics of Embodied Conversational Agents (ECAs) that make rehabilitation sessions more enjoyable and engaging for children. A systematic literature review was, therefore, conducted across PubMed, Scopus and ACM Digital Library for papers published between 2010 and 2026, following the PRISMA 2020 guidelines. A total of 200 records were identified, with 24 studies meeting the inclusion criteria. This review addresses three research questions addressing three research questions: (RQ1) which language and communication disorders are primarily addressed; (RQ2) what embodiment configurations are adopted; and (RQ3) whether ECAs improve clinical outcomes compared to standard care. The analysis reveals a limited but increasing number of studies, suggesting that ECAs are an emerging tool not yet widely adopted in clinical practice, predominantly used in speech therapy for language rehabilitation, but also applicable to social skills development. Physically embodied ECAs appear predominant, with a distinction between custom-developed systems and commercially available platforms; in both cases, a non-threatening, toy-like appearance prevails. However, longitudinal evidence is lacking on whether ECAs, whose multimodal communicative repertoire, encompassing verbal, prosodic, gestural, and facial channels, fosters a sense of social presence that approximates human interaction, can sustain a therapeutic relationship with pediatric users that supports clinical goals and maintains engagement across repeated sessions."}, {"id": 41, "type": "long", "title": "Using AI-Generated Videos to Simulate Different People Communicating the Same Healthcare Needs: An Exploratory Study of Care Prioritisation and Trust Across Health Professional and Public Groups", "authors": "Amanda Kearns, Anne Moorhead, Maurice Mulvenna and Raymond\nBond", "keywords": "trust\nAI-mediated health communication\nAI-generated video case studies\ncare prioritisation\nbiopsychosocial care\ncognitive ergonomics\naffective ergonomics", "abstract": "Digital technologies increasingly shape how health information is presented and interpreted in communication-intensive contexts. In healthcare, such communication is cognitively and emotionally demanding, particularly in contexts involving stigma and uncertainty. While evaluations of artificial intelligence (AI) systems typically focus on performance and usability, less is known about how different viewer groups interpret AI-generated health communication in these sensitive care contexts. This exploratory study examines whether AI-generated video case studies can support controlled comparison of how health professionals and members of the public interpret healthcare needs and care priorities. Four AI-generated video case studies were developed, each simulating a client profile presenting concerns related to obesity and mental health within a healthcare consultation, delivered as a one-way, non-interactive communication. Each case followed a shared core narrative with structured variation in sociocultural context, creating distinct client profiles and enabling comparison of interpretation under consistent informational conditions. Participants were randomly assigned to view one video within an online survey and completed ranking tasks on care priorities alongside evaluations of AI's perceived impact on communication and trust.\n\nAcross participant cohorts, psychological and lifestyle-related care were prioritised over biomedical interventions, indicating a shared biopsychosocial framing of care. Responses to AI-generated communication were characterised by ambivalence, with concerns centred on loss of human touch, oversight, and relational risk rather than technical performance. Variability in viewer perception was observed across AI-generated client profiles among public participants, suggesting sensitivity to sociocultural cues despite standardised content. These findings suggest that ambivalence and variability may reflect adaptive responses to cumulative cognitive, emotional, and organisational demands rather than resistance or error. Trust is interpreted as a conditional judgement shaped by relational expectations and organisational context. Implications are discussed for the design of AI-generated communication systems in emotionally complex care domains."}, {"id": 56, "type": "long", "title": "The Eyes Don’t Lie: Detecting Cognitive Load in VR Assembly Training using Built-in Pupillometry", "authors": "Anouk Michiels, Eva Geurts and Gustavo Rovelo Ruiz", "keywords": "Virtual Reality\nAdaptive Learning\nCognitive load\nEye-tracking\nWell-being\nIndustry 5.0\nManufacturing\nUser-centered design", "abstract": "Careful design of Virtual reality (VR) training is necessary to optimize knowledge retention while avoiding excessive mental strain. In this context, personalized learning trajectories represent a key strategy by dynamically addressing individual needs, such as adapting the pace, content or level of guidance. In such trajectories, cognitive load metrics provide a reliable indicator of perceived task difficulty, serving as a trigger to adjust the training parameters accordingly. However, current cognitive load assessment methods are often intrusive or limited to post-hoc subjective measurements. Therefore, we assessed whether pupillary responses captured by built-in eye-tracking sensors reflect cognitive load. Using a comparative experimental design, we manipulated task difficulty through varying assistance levels in a VR assembly training to compare pupillary responses against subjective workload differences confirmed by the NASA-TLX. The results of our study demonstrate a clear convergence between subjective workload and objective physiological data: increased perceived mental effort was mirrored by significant pupil dilation, while a decrease led to pupil constriction. These findings support the feasibility of built-in pupillometry for cognitive workload detection and provide a necessary step toward adaptive VR training systems that respond to the trainee's cognitive state in real time."}, {"id": 45, "type": "wip", "title": "A Phygital Game Prototype to Support Speech-Therapy-in-the-Loop AI in Pediatric Rehabilitation", "authors": "Alessia Nicoletta Marino, Liliana Vale Costa and Patrizia\nMarti", "keywords": "Phygital game\nSpeech Therapy\nChildren\nEmbodied Conversational Agent\nPediatric Rehabilitation", "abstract": "Speech perception is one of the fundamental prerequisites for correct language development in childhood. This process may be compromised in children with Speech Sound Disorders (SSD), for whom early speech therapy intervention is essential. In this context, play-storytelling may constitute privileged intervention tools, given it can simultaneously activate physical, cognitive, and socio-emotional dimensions in child development, making it a speech therapist's ally in repetitive activities of rehabilitative practices. This work-in-progress paper presents a phygital game designed to improve phoneme recognition in children with SSD.  Grounded in the principles of Self-determination Theory (SDT) combined with TRACE Speech Perception Theory, the game aims to assist the speech perception activities using a physical component, consisting of composable phoneme cards, and an Embodied Conversational Agent (ECA) acting as mediator, storyteller, and motivator. A conceptual framework on the use of an Embodied Conversational Agent (ECA) in a phygital environment associating Autonomy, Competence and Relatedness (SDT theory) to categorical perception in speech rehabilitation is presented, involving a triadic relationship among child, game-based ECA phygital intervention and the therapist. This contribution include a conceptual model framework on the use of ECAs in a phygital environment and a prototype system aimed at recognizing and distinguishing phonemes during speech-language rehabilitation sessions."}, {"id": 36, "type": "short", "title": "Rethinking Prosthetic Hands: From Transparent Replacement to Intelligent Instruments", "authors": "Maria Rosanna Fossati, Cristina Piazza and Antonio Bicchi", "keywords": "prosthetics\ncognitive ergonomics\nshared autonomy\nUser centered design\nhaptic feedback", "abstract": "The dominant paradigm in upper-limb prosthetics has long been grounded in the principle of biological replacement: the prosthesis is conceived as the functional completion of a missing body part, ideally restoring natural and full transparent control. Despite major advances in design and engineering (mechatronics, sensing, and control), this transparency paradigm continues to place a substantial cognitive burden on the user, who must often supervise and control low-level actuation details. We observe a conceptual shift that opens an opportunity for renewed technology design: prosthetic hands should no longer be conceived primarily as body replacements striving for full transparency, but rather as intelligent instruments oriented toward user experience, task efficacy, and shared autonomy. Drawing on human factors research, cognitive ergonomics, neuroscience, we propose a human-centered design framework in which levels of autonomy are structured around human perceptual and cognitive constraints. We argue that shared autonomy in prosthetics should mirror the logic of other intelligent artifacts, where autonomous intervention may reduce cognitive load while preserving user agency. From this perspective, embodiment is reframed not as complete transparency, but as a calibrated integration between perception and action, while trust is reframed as appropriate reliance on an intelligent partner system. We conclude with a tangible example concerning haptic feedback."}]}, "track": "A"}, {"title": "AI in Professional and Organisational Practice", "kind": "session", "session": {"title": "AI in Professional and Organisational Practice", "papers": [{"id": 14, "type": "long", "title": "Assessing the Cognitive and Operational Impacts of AI in Airspace Configuration for Flow Management Positions", "authors": "Daniele Ruscio, Marianna Groia and Luigi Perrotta", "keywords": "Dynamic Airspace Configuration\nFlow Management Role\nHuman-AI Teaming\nHuman Performance Evaluation\nDeep Neural Network\nSafety\nTransitional Factors\nOrganization Impact\nTraining", "abstract": "As European airspace approaches its operational saturation limits, the Air Traffic Management community is increasingly turning to artificial intelligence to support the complex task of Demand and Capacity Balancing. This paper presents preliminary findings from a human-in-the-loop Real-Time Simulation testing an AI-based tool for Dynamic Airspace Configuration, to increase the flexibility and dynamicity of airspace management to better accommodate growing traffic demands during baseline, nominal and contingency situations. Preliminary results show the possible impact of the introduction of an AI-based decision-support tool in operating procedures for airspace configuration, especially on Flow Management Position operators’ cognitive workload, situation awareness, trust. The discussions with the front-end operators also highlighted how the AI decision-support tool could have broader implications for the future skills, competencies, and responsibilities of the Flow Management Position (FMP). Specifically, the need for targeted training programs as well as organizational and regulatory discussions to define which traditional skills must be preserved and which new supervisory competencies must be acquired to maintain FMPs’ accountability, and adequate human oversight."}, {"id": 39, "type": "long", "title": "Augmented Intelligence for Professional Recruiting: designing an Advisor-in-the-Loop system to support the job interview process", "authors": "Martina Pozzolini, Gaetano Mongelli, Matteo Passarelli and\nAntonio Rizzo", "keywords": "Interaction design\nAI\nHuman-Centered AI\nHuman on the loop\nProfessional Recruiting", "abstract": "This paper presents the design and formative evaluation of an Augmented Intelligence (AuI) prototype that supports professional recruiters throughout the job interview process without automating it. We argue for a transition from the conventional Human-in-the-Loop (HITL) paradigm to an Advisor-in-the-Loop (AITL) architecture, in which the human expert operates as a Reasoning Architect — co-constructing the system's evaluative logic before, during, and after each interview rather than functioning as a corrective checkpoint on an otherwise autonomous pipeline. Building on theoretical analysis, interviewer failure taxonomy, and primary field research with recruiters and HR professionals, the prototype's three-layer architecture (Data, Modeling, Governance) and four-phase interaction model (Scenario Designer, Live Interview Dashboard, Reflective Synthesis, Governance Closure) operationalize four non-negotiable governance properties at the interface level: strict traceability, unconditional overrideability, active bias flagging, and explicit accountability closure. A formative evaluation combining heuristic inspection and structured expert review — conducted at prototype stage, prior to summative field deployment — indicates that the design is internally coherent, professionally acceptable, and free of major interaction failures that would undermine its governance objectives. The evaluation also surfaces a behavioural asymmetry between accepting and overriding AI suggestions under time pressure, a finding that refines the design and contributes to the broader HCI literature on automation bias in high-stakes decision-making. The paper's central claim is that in high-stakes social evaluation contexts, Augmented Intelligence is best understood not as a compromise between automation efficiency and human oversight but as the epistemically more defensible design choice, because the judgment required cannot be reliably produced by either component in isolation — a position advanced as a theoretically motivated design argument supported by formative evidence, not as a demonstrated empirical superiority of the Advisor-in-the-Loop model over alternative architectures."}, {"id": 48, "type": "long", "title": "When AI Answers Too Soon: The Displacement of Reflective Inquiry in Design", "authors": "Peter Dalsgaard", "keywords": "Cognition\nHuman-Computer Interaction\nGenerative Artificial Intelligence\nInquiry\nDesign", "abstract": "Generative AI tools in design are evaluated mainly by the quality and speed of their outputs. This paper argues that such evaluation overlooks what these tools do to the temporal structure of inquiry, and therefore to the designer engaged in it. Drawing on Schön's account of reflective practice, Dewey's theory of inquiry, and the phenomenology of skilled tool use, it proposes a three-phase model of AI-mediated inquiry and identifies where, in each phase, current tools tend to displace the reflective and developmental work of the practitioner. The cumulative mechanism is named reflective short-circuiting: the restructuring of inquiry so that the temporally extended moments through which designers constitute problems, dwell in uncertainty, and develop reflective judgment are shortened, pre-empted, or substituted. The paper situates this account within cognitive ergonomics through Rasmussen's Skills-Rules-Knowledge taxonomy and Hollnagel's efficiency-thoroughness trade-off, and proposes design principles for tools that keep the productive phases of inquiry intact."}, {"id": 53, "type": "wip", "title": "Exploring Trust Factors in Designing AI-Supported Performance Appraisal System", "authors": "Andreas Harnindito and Akshat Sawarni", "keywords": "Performance appraisal\nArtificial intelligence\nTrust\nHuman-AI collaboration", "abstract": "Performance appraisal is a critical organizational process that directly influences employee development, compensation, and career progression. Despite growing interest in Artificial Intelligence (AI)-assisted appraisal systems, little is understood about the factors that make such systems trustworthy from the perspective of those who use them. This study addresses this gap by investigating the factors that shape trust in AI-supported performance appraisal across three stakeholder groups: managers, employees, and Human Resource (HR) managers. Using semi-structured interviews with 12 participants across four countries and reflexive thematic analysis, the study identifies three overarching themes from the manager group. First, trust in the current appraisal process is already structurally compromised by recency bias, unacknowledged subjectivity, and opacity. Second, trust in AI is contingent upon non-negotiable boundaries, including explainability, data quality, and human oversight. Third, AI integration carries dual implications, where it can either restore fairness through longitudinal consistency or deepen distrust through bias amplification and privacy invasion. The findings suggest that trustworthy AI integration requires addressing pre-existing structural failures before introducing algorithmic decision support. These results offer design recommendations for AI-supported appraisal systems, with implications for HCI research and organizational practice."}, {"id": 60, "type": "short", "title": "LLM-empowered remanufacturing: A novel human-AI interaction under the lens of a scoping review", "authors": "Alireza Mortezapour, Mario Caterino and Marcello Fera", "keywords": "Industry 5.0\nSustainability\nrecycling\ndisassembly\nclosed-loop supply chain", "abstract": "In recent years, due to the high importance of raw materials, cost reduction pressures, and environmental concerns, remanufacturing processes have gained significant importance. In parallel, different Artificial Intelligence (AI) models especially, Generative AIs (Gen AIs) have been penetrating into work environments to improve efficiency and effectiveness of the tasks. Aim of this article is to provide a scoping review of studies addressing the use of Gen AI in remanufacturing processes. The literature search was conducted across four major databases, and the results were complemented using Google Scholar. In total, 23 articles were included in the final stage of analysis. Gen AI systems text-based, vision-based, and multimodal, deployed both locally and in cloud-based environments, were found to be utilized in these processes. The majority of studies focusing on LLM models developed by OpenAI. The most prominent contributions of Gen AI were observed in the following areas: Code Generation and Robotic Control, Safety and Risk, Supporting system performance as a powerful “eye”, and Intelligent Planning and Reasoning (as the strategist of the system). It appears that the initial phase of introducing diverse applications of generative AI models in remanufacturing processes is approaching its conclusion. In the coming years, with the rapid advancement of generative AI, a substantial portion of these processes is expected to be delegated to such systems, and it is even conceivable that they may partially replace robots in certain tasks."}]}, "track": "B"}]}, {"start": "11:00", "end": "11:30", "tracks": [{"title": "Coffee break", "kind": "break"}]}, {"start": "11:30", "end": "13:00", "tracks": [{"title": "Generative AI, Identity and Creative Cognition", "kind": "session", "session": {"title": "Generative AI, Identity and Creative Cognition", "papers": [{"id": 6, "type": "long", "title": "Generative AI Makes Creative Output More Homogeneous", "authors": "Alwin de Rooij and Michael Mose Biskjaer", "keywords": "Generative Artificial Intelligence\nHomogenization\nHuman–AI Co-Creation\nMeta-Analysis", "abstract": "Does using generative AI make creative outputs more homogeneous? As creative practice increasingly involves using generative AI, concerns have emerged that creative outputs may become more homogeneous across users, even when individual creativity improves. We address this concern through a systematic review and meta-analysis of empirical studies on homogenization in human–AI co-creation (19 studies, 61 effect sizes). Results reveal a small but statistically significant homogenization effect associated with AI use (d = .334). The effect is robust across sensitivity analyses and not explained by publication bias. Rather than indicating a loss of creativity, the findings suggest a reorganization of creative diversity in human–AI co-creation. The results highlight that gains in individual creative performance may coexist with reduced diversity at the collective level."}, {"id": 54, "type": "long", "title": "The Generation Effect and AI-Assisted Writing: Towards a Framework of Cognitive Fidelity", "authors": "Peter Dalsgaard", "keywords": "Generative AI\nWriting\nGeneration Effect\nCognition\nCognitive Fidelity\nAI-Assisted Writing\nHuman-Computer Interaction", "abstract": "Writing has long been understood as an epistemic activity: a way of developing thought, not merely expressing it. The generation effect in cognitive psychology shows that self-generated material is remembered and understood significantly better than passively received material, and writing research has long argued that the productive struggle of articulation and reformulation is itself a vehicle for knowledge transformation. Generative AI changes the conditions under which this cognitive work occurs. When writers shift from generating to evaluating and selecting AI-produced text, they move from a generation condition to something closer to a reading or response condition, which may lack the cognitive properties that have historically made writing a powerful epistemic tool. This paper argues that critical facets of AI-mediated writing are under-theorized because current research focuses on output quality, efficiency, and integrity rather than on the cognitive value of the writing process itself. We introduce the concept of cognitive fidelity, understood as the degree to which a writing process requires the writer to generate rather than receive the emerging text, as a framework for analyzing these conditions and as a design criterion for evaluating and building AI writing tools. We develop three dimensions of cognitive fidelity (origination, articulation, and reformulation), situate the concept relative to existing frameworks, and draw out implications for the design of AI writing tools and for future research."}, {"id": 57, "type": "long", "title": "Identity in the Loop Cognitive Ergonomics of the Mediated Voice and the Future of Service Work", "authors": "Cosimo Spera", "keywords": "cognitive ergonomics\nhuman–AI interaction\nAI governance\nContact centers\nFuture of Work", "abstract": "Real-time AI systems that modify a worker's vocal, physical, or behavioural presentation during live interactions are entering service-work infrastructure at scale. Existing cognitive-ergonomic frames — automation, augmentation, human-in-the-loop supervisory control — handle this class of intervention poorly because the AI acts neither on the worker's task nor on the informational resources used to perform the task, but on features of the worker's embodied output that carry identity information before the output reaches the receiver. This paper makes three contributions. First, it defines identity-layer AI as a distinct locus of human–AI intervention characterised by this intervention point. Second, it introduces a three-party mental-model asymmetry framework in which worker, deploying enterprise, and receiving customer hold partial and non-overlapping role-relative models of what is being modified, by whom, and toward what target profile; the framework is formalised in terms of role-adequate mental-model alignment, and the design and governance corollaries (the Identity Modification Transparency Protocol) are derived from it. The framework speaks directly to the trust, transparency, and deception concerns that real-time voice modification raises. Third, it translates the framework into an empirical research agenda specifying four cognitive-ergonomic study designs that measure disclosure salience, agent workload, perception gap between produced and delivered voice, and longitudinal occupational-identity effects. AI-powered accent modification in global contact centres serves as the leading deployment case; publicly available worker-experience reporting provides a preliminary — and explicitly stratified — evidence base. The paper concludes with implications for the future of service work: the dissolution of embodied locality, longitudinal risk of occupational identity drift, and the measurement challenges that arise when AI modifies rather than replaces human output."}, {"id": 15, "type": "wip", "title": "Gender Representation in Chatbot Design: Implications for User Experience", "authors": "Christof van Nimwegen and Lotte Consten", "keywords": "chatbots\nhci\ngender", "abstract": "This pilot study investigated the influence of gender of a chatbot and gender of users on the User Experience, along the dimensions of warmth/friendliness, competence, trust, human-likeness user satisfaction and helpfulness. When interacting with a chatbot, users often categorize the chatbot as female, gender-neutral or male, relying on stereotypes of offline human interactions. Current studies mostly compare only male and female. “Neutral” is often omitted, just as the context it takes place in and the device used, which might play a role. An experiment was done in which participants had dialogues with 3 chatbots with different genders (female-neutral-male) in different contexts (healthcare, financial, e-commerce). After each dialogue (with the same chatbot) participants filled out a questionnaire gauging their experiences. Results showed no significant results as consequence of the manipulations. Nevertheless, some trends are observed, some patterns point at a neutral chatbot being more appreciated, and that perhaps the device it took place plays a role. A follow-up study will take place in which differences in chatbot gender are more strongly operationalized, with more natural interactions in more realistic settings and with many more participants."}, {"id": 35, "type": "wip", "title": "\"AI will figure it out\": System Compensation and Intent Deferral in Open-Ended Generative AI Interfaces", "authors": "Paulo Ferreira and Sonia Sousa", "keywords": "Generative AI\nintent deferral\nsystem compensation\ncognitive ergonomics\nconstructive friction", "abstract": "Open-ended generative AI systems may be reshaping how cognitive effort is distributed before and during task execution. This work-in-progress paper introduces two interrelated concepts: system compensation, the system's ability to generate coherent responses from underspecified inputs, and intent deferral, the user behavior of relying on the system to resolve missing task parameters. We argue that system compensation may be removing a critical calibration signal to the user, potentially shifting automation-like overreliance into the input construction phase of generative AI interaction. Three exploratory observational sessions with 23 participants reveal four recurring interaction patterns. An intervention introducing constructive friction, requiring explicit intent specification before a system response, provoked resistance, suggesting that system compensation shapes expectations of immediacy. We discuss implications for cognitive ergonomics and open-ended interface design."}]}, "track": "A"}, {"title": "Social Perception, Identity and Self-Presentation", "kind": "session", "session": {"title": "Social Perception, Identity and Self-Presentation", "papers": [{"id": 16, "type": "long", "title": "Dimensions of Self-Disclosure and Visual Self-Presentation in WhatsApp Profile Pictures Among Young Adults", "authors": "Francesco Curro, Elisa Nanni and Oronzo Parlangeli", "keywords": "Emotional intelligence\nSelf-disclosure\nWhatsApp profile pictures\nComputer-mediated communication\nHuman-computer interaction\nNetwork analysis", "abstract": "The profile picture is often the first and sometimes only visual cue of a user's identity in messaging platforms, making it a relevant object of inquiry for human-computer interaction. This study examines how the dimensions of self-disclosure (SD) relate to the visual self-presentation enacted in WhatsApp profile pictures, in a sample of 186 Italian young adults, combining a multidimensional self-report SD measure with independent visual coding of the pictures. The five SD dimensions (amount, depth, valence, accuracy, and intention) formed a coherent, positively interrelated structure, with amount and depth most strongly associated and the qualitative dimensions clustering among themselves. Crucially, specific SD dimensions mapped onto specific visual cues: deeper disclosure co-occurred with a more direct gaze and a more deliberately posed image, while more intentional disclosure co-occurred with more expressive facial displays. These findings suggest that the way people disclose verbally is reflected, along specific dimensions, in how they present themselves visually, with implications for the design of self-presentation affordances and for the interpretation of visual cues in computer-mediated communication."}, {"id": 49, "type": "long", "title": "Stance Signaling for Social Justice on Social Media: Does It Boost and Accelerate User Engagement?", "authors": "Noor Sadiah, Sameha Alshakhsi, Ala Yankouskaya, Marwa\nQaraqe, Raian Ali and Dena Al Thani", "keywords": "Human-Centered Computing\nHuman-Computer Interaction\nInteraction Design\nCollaborative and Social Computing\nStance-Signaling\nEye-Tracking Study\nSocial Inclusion\nAffordances", "abstract": "Social media platforms increasingly serve as spaces for engaging with complex and socially sensitive topics. However, users’ willingness to interact with such content is often shaped not only by the content itself but also by the design of interaction mechanisms. This study investigates how alternative interface designs with embedded stance-signaling mechanisms affect user engagement, decision-making, and attention compared to the traditional interface. We proposed two stance-signaling techniques that allow users to anonymously express their stance on a social justice post before the aggregated vote results are shown. Using a controlled experiment with 1,080 observations from 90 participants, we employed a generalized mixed model (GMM) and a Linear Mixed Model (LMM) alongside eye-tracking measures to examine interaction behavior, response time, and visual attention. Results indicate that while post type, whether positive (supportive) or negative (hostile), influences engagement in traditional interfaces, its effect is substantially reduced in alternative designs that also incorporate stance-signaling. Additionally, these stance-signaling mechanisms lead to more reactions than skips and to faster decision-making, suggesting reduced cognitive and social barriers to participation. These findings highlight the importance of interface affordances in shaping online behavior and suggest that alternative interaction designs can promote more inclusive and consistent engagement, particularly in contexts involving socially sensitive content."}, {"id": 30, "type": "long", "title": "Does Violent Video Gaming Induce Hostile Emotional Processing in Habitual Players? Evidence from Eye-Tracking Metrics", "authors": "Anantha Ubaradka and Sanjram Premjit Khanganba", "keywords": "Violent video games\nFacial emotion recognition\nAggression\nGeneral Aggression Model", "abstract": "The present study examined whether habitual interaction with violent video games would result in biased emotional information processing among players. A total of 42 adult students, categorized as habitual violent video gamers (HVVGs; n = 21, Mage = 20.09 years, SD = 0.89) and non-video gamers (NVGs; n = 21, Mage = 21.66 years, SD = 2.01), took part in the study. Participants completed an emotional go/no-go task that required them to recognize facial expressions of happiness, anger, disgust, fear, and sadness. Results indicated that HVVGs outperformed NVGs in the emotion recognition task, demonstrating higher response accuracy and faster reaction times. Overall recognition capacity was superior for happiness than for the negative emotions across the groups. Fixation metrics corroborated this pattern. Participants showed shorter times to first fixation in the mouth region when recognizing happiness, along with longer first and total fixation durations. This consistent gaze pattern suggests greater perceptual salience of happiness on a specified facial region, contributing to its recognition advantage. In contrast, recognition of negative emotions showed a scattered gaze pattern, indicating weaker diagnostic cues in specific facial regions, rather than reflecting an emotional desensitization. Overall findings call into question the General Aggression Model’s assertion that habitual violent video gaming promotes hostile emotional processing and caution against attributing aggression primarily to violent video games in isolation. Instead, the findings emphasize the importance of accounting for a wider constellation of dispositional and environmental factors when explaining aggression in video gamers."}, {"id": 19, "type": "short", "title": "Early Neural Responses to Robot, Human, and Doll Faces: N170 and EPN Evidence", "authors": "Simone Grassini, Saryz Taha Mamsheli, Amanda Tunes Paulsen\nand Enrico Cipriani", "keywords": "social robots\nElectroecephalography\nFace perception\nUncanny valley\nEmotions", "abstract": "The increasing use of social robots requires evidence on how the human brain processes artificial faces during early perceptual and emotional stages. This short paper reports a focused ERP analysis of the N170 and early posterior negativity (EPN) from an EEG study in which 28 participants viewed human, robot, and doll faces displaying happy, fearful, and neutral expressions. Robot faces elicited the strongest N170 modulation, followed by doll and human faces, suggesting that robot faces are encoded as face-like stimuli but impose greater early structural processing demands than biological faces. The EPN showed significant effects of expression and face type, together with a face-type × expression interaction. Across conditions, fearful expressions elicited the most negative mean amplitude, followed by happy and neutral expressions, whereas human faces elicited the most negative amplitude, followed by doll and robot faces. These findings indicate that robot faces engage early face-sensitive processing while their emotional expressions receive weaker early affective prioritization than human expressions. The results distinguish early structural face encoding from early emotional attention and identify separate design targets for social-robot faces."}, {"id": 32, "type": "wip", "title": "When appearance meets personality: robot age and individual differences in the evaluation of cheating robots", "authors": "Ludovica Misino, Stefano Guidi, Luca Lusuardi, Alessandro\nInnocenti and Oronzo Parlangeli", "keywords": "Human–Robot Interaction (HRI)\nRobot age\nDark Triad\nLie acceptability\nMind perception", "abstract": "As robots increasingly engage in autonomous and socially meaningful actions, understanding how humans evaluate morally ambiguous robot behaviour is a central challenge in Human–Robot Interaction (HRI). This study investigates how robot age cues and individual differences influence the evaluation of deceptive behaviour displayed by robots in immersive virtual reality. Drawing on theories of mind perception and moral agency, we examine whether Dark Triad personality traits and lie acceptability shape tolerance toward robot cheating and interact with robot age (adult-like vs. child-like) in predicting perceived agency, experience, moral responsibility, and trust. Participants interacted with a humanoid robot that engaged in systematic cheating during a competitive rock–paper–scissors task in virtual reality. Results (N = 56) show no significant main effect of robot age on moral or cognitive evaluations, suggesting that explicit cheating behaviour may override appearance-based cues. However, significant interactions emerged between robot age and individual differences. Exploratory analyses suggested that narcissism was positively associated with perceived agency and experience, particularly in the adult-like robot condition. Similarly, lie acceptability predicted higher perceived experience and lower dependency exclusively in the adult-like condition. These findings suggest that the evaluation of robot misconduct depends on the interaction between design features and observer dispositions rather than on robot characteristics alone. Adult-like robots appear to amplify individual differences, whereas child-like robots may attenuate them. The study contributes to HRI research by highlighting the importance of considering both user traits and design cues in morally sensitive interactions, with implications for the development of socially acceptable artificial agents taking into consideration ethical concerns regarding the strategic use of dark patterns in the field of social robotics. Ultimately, these findings advocate for HRI design standards that prioritize behavioral transparency and ethical accountability."}]}, "track": "B"}]}, {"start": "13:00", "end": "14:00", "tracks": [{"title": "Lunch", "kind": "break"}]}, {"start": "14:00", "end": "15:30", "tracks": [{"title": "AI Trust and Autonomy in Human-Machine Systems", "kind": "session", "session": {"title": "AI Trust and Autonomy in Human-Machine Systems", "papers": [{"id": 29, "type": "long", "title": "From Psychological Need Satisfaction to AI Dependency: The Divergent Roles of Basic and AI-Specific Needs", "authors": "Oronzo Parlangeli, Francesco Currò, Margherita Bracci,\nEnrica Marchigiani, Lorenzo Reina and Paola Palmitesta", "keywords": "AI use\nAI dependency\nBasic Psychological Needs\nAutono
