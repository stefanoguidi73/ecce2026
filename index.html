}, {"start": "18:00", "end": "19:00", "tracks": [{"title": "Keynote — Contrada (Witchel)", "kind": "keynote"}]}, {"start": "19:00", "end": "19:30", "tracks": [{"title": "Visita contrada", "kind": "event"}]}, {"start": "19:30", "end": "", "tracks": [{"title": "Social dinner", "kind": "event"}]}], "18": [{"start": "09:30", "end": "11:00", "tracks": [{"title": "Social Media, Attention and Cognitive Workload", "kind": "session", "session": {"title": "Social Media, Attention and Cognitive Workload", "papers": [{"id": 49, "type": "long", "title": "Stance Signaling for Social Justice on Social Media: Does It Boost and Accelerate User Engagement?", "authors": "Noor Sadiah, Sameha Alshakhsi, Ala Yankouskaya, Marwa Qaraqe, Raian Ali and Dena Al Thani", "keywords": "Human-Centered Computing\nHuman-Computer Interaction\nInteraction Design\nCollaborative and Social Computing\nStance-Signaling\nEye-Tracking Study\nSocial Inclusion\nAffordances", "abstract": "Social media platforms increasingly serve as spaces for\nengaging with complex and socially sensitive topics.\nHowever, users’ willingness to interact with such content\nis often shaped not only by the content itself but also by\nthe design of interaction mechanisms. This study\ninvestigates how alternative interface designs with\nembedded stance-signaling mechanisms affect user\nengagement, decision-making, and attention compared to the\ntraditional interface. We proposed two stance signaling\ntechniques that require individuals to express their stance\non a social justice post anonymously before showing them\nthe aggregated votes results. Using a controlled experiment\nwith 1,080 observations from 90 participants, we employed a\ngeneralized mixed model (GMM) and Linear Mixed Model (LMM)\nalongside eye-tracking measures to examine interaction\nbehavior, response time, and visual attention. Results\nindicate that while post type, whether positive\n(supportive) or negative (hostile), influences engagement\nin traditional interfaces, its effect is substantially\nreduced in alternative designs that also incorporate stance\nsignaling. Additionally, these stance-signaling mechanisms\nlead to more reactions than skips and to faster\ndecision-making, suggesting reduced cognitive and social\nbarriers to participation. These findings highlight the\nimportance of interface affordances in shaping online\nbehavior and suggest that alternative interaction designs\ncan promote more inclusive and consistent engagement,\nparticularly in contexts involving socially sensitive\ncontent."}, {"id": 16, "type": "long", "title": "Dimensions of Self-Disclosure and Visual Self-Presentation in WhatsApp Profile Pictures Among Young Adults", "authors": "Francesco Curro, Elisa Nanni and Oronzo Parlangeli", "keywords": "Emotional intelligence\nSelf-disclosure\nWhatsApp profile pictures\nComputer-mediated communication\nHuman-computer interaction\nNetwork analysis", "abstract": "This study examines the relationships among trait emotional\nintelligence (EI), self-disclosure (SD) dimensions, and\nvisual self-\npresentation in WhatsApp profile pictures in a sample of\n186 Italian young adults. We investigated whether EI is\nassociated\nwith SD dimensions and whether visual characteristics\nrelate to psychological traits through self-report measures\nand\nindependent visual coding of profile pictures. Results show\nthat trait EI is selectively correlated with the\nqualitative dimensions\nof SD — positive valence, accuracy, and intentionality —\nbut not with amount or depth, suggesting that higher\nperceived\nemotional competence is linked to more regulated,\nauthentic, and deliberate online communication rather than\nto greater\nfrequency or intimacy of disclosure. Network analysis of\nvisual parameters identified gaze direction and gaze\nengagement as\nthe central organizing elements of visual identity.\nContrary to expectations, trait EI was not directly\nassociated with visual\nself-presentation characteristics. However, certain\ndimensions of self-disclosure—particularly depth and\nintentionality—were\nlinked to specific visual cues, such as direct gaze and\nmore expressive facial displays, suggesting that deeper and\nmore\nintentional self-disclosure is reflected in more engaged\nand deliberate visual presentation. These findings\ncontribute to a better\nunderstanding of how individuals manage digital identity in\nmessaging platforms, with implications for HCI research on\ninterface design, ergonomics, self-presentation\naffordances, and the role of visual cues in\ncomputer-mediated communication."}, {"id": 14, "type": "long", "title": "Assessing the Cognitive and Operational Impacts of AI in Airspace Configuration for Flow Management Positions", "authors": "Daniele Ruscio, Marianna Groia and Luigi Perrotta", "keywords": "Dynamic Airspace Configuration\nFlow Management Role\nHuman-AI Teaming\nHuman Performance Evaluation\nDeep Neural Network\nSafety\nTransitional Factors\nOrganization Impact\nTraining", "abstract": "As European airspace approaches its operational saturation\nlimits, the Air Traffic Management community is\nincreasingly turning to artificial intelligence to support\nthe complex task of Demand and Capacity Balancing. While\nits technical feasibility has been progressively\ndemonstrated, its human and organisational implications\nremain largely unexplored. This paper presents findings\nfrom a human-in-the-loop Real-Time Simulation with\nexperienced Flow Management Position operators, assessing\nthe impact of a DAC-enabled decision-support tool on\ncognitive workload, situation awareness, trust, and role\nperception across nominal, adverse weather, and Dynamic\nMobile Area scenarios. Results confirm the system's\noperational promise under nominal conditions while\nhighlighting specific limitations under adverse weather,\nand surface broader implications for how intelligent\nautomation may reshape the skills, competencies and\nresponsibilities of the operators who remain ultimately\naccountable for the safety of the airspace."}, {"id": 38, "type": "wip", "title": "Toward an Eye-Tracking Adaptive Interface for Interactive Evolutionary Computation", "authors": "Anais Tracoulat, Teresa Colombi, Denis Pallez, Nolwenn Gauer, Ambre Mounié, Marie Waeles-Devaux, Gabriel Al-Najjar and Arion Haxhui", "keywords": "- interactive evolutionary computation\n- eye tracking\n- adaptive interface\n- cognitive load\n- human-AI interaction", "abstract": "Interactive Evolutionary Computation (IEC) refers to\noptimization methods in which human evaluations are\nintegrated into the search process (Wang and al.,2024).\nThis approach is particularly relevant when the quality of\na solution cannot be defined through objective mathematical\ncriteria alone, because it depends on subjective\npreferences, perceptual judgments, or implicit mental\nrepresentations (Sweller and al.,2011). For instance, a\nuser may have a mental representation of an ideal product,\nsuch as a piece of clothing, an interior layout, or a\ngraphical interface, without being able to explicitly\nformalize all the criteria defining this preference.\n\nHowever, IEC systems are limited by the number of\nevaluations that users can perform before cognitive\nfatigue, attentional overload, or disengagement occur\n(Sweller and al.,2011). Traditional evolutionary algorithms\noften require many evaluations to converge, whereas human\nusers have limited cognitive resources. This creates a\ncentral challenge for human-algorithm interaction:\nsupporting algorithmic convergence while preserving\nacceptable cognitive conditions for the user.\n\nThis work-in-progress paper presents an experimental\nprotocol comparing a fixed display condition with an\neye-tracking-based adaptive display condition. In the fixed\ncondition, a constant number of candidate items is\ndisplayed. In the adaptive condition, the interface\ndynamically adjusts the number of displayed items according\nto the user's estimated cognitive state. The objective is\nto determine whether an adaptive interface can reduce\ncognitive load while maintaining observable convergence\ntoward a target item. Expected measures include target\nrecognition performance, search time, pupil dilation,\nsubjective workload, and the average number of displayed\nitems. This work contributes to the design of adaptive\nhuman-algorithm interfaces that account for both\nalgorithmic performance and human cognitive limitations.\n\n-\nJohnSweller,PaulAyres,andSlavaKalyuga.2011.CognitiveLoadTheory.doi:10.1007/978-1-4419-8126-4\n-Y.WangandY.Pei.2024.A comprehensive survey on interactive\nevolutionary computation in the first two decades of the 21\nstcentury.Applied Soft Computing 164(2024)\n,111950.doi:10.1016/j.asoc.2024.111950"}, {"id": 9, "type": "wip", "title": "Robot assistants during high mental workload: Understanding Task-Specific Load in Human–Robot Interaction", "authors": "Valentina Cesari, Jacopo Elettari and Agnieszka Wykowska", "keywords": "human-robot interaction\ncognitive ergonomics\ncognitive offloading\nmental workload", "abstract": "Cognitive offloading refers to the redistribution of task\ndemands with the aim of reducing an individual’s mental\nworkload.  A promising strategy in this domain involves\nleveraging robotic agents, whether humanoid or\nnon-humanoid, to support such task redistribution. However,\nthis process is not straightforward, as the effectiveness\nof a robot as an offloading agent critically depends on\nidentifying the specific type of mental workload\nexperienced by the user. Mental workload is a\nmultidimensional construct that includes demands on\nperception, working memory, and executive functions;\ntherefore, accurately characterizing the type of load\nduring task execution is essential for designing effective\noffloading strategies. Importantly, this characterization\nalone is not sufficient, as it is equally necessary to\nidentify the specific stage of the task that is most\nsensitive to workload fluctuations, since the benefits of\noffloading may depend on when support is provided. To\naddress this challenge, we propose three experiments aimed\nat identifying mechanism-specific markers of workload and\nevaluating robot-assisted cognitive offloading. The first\nexperiment focuses on perceptual load using a visual search\nparadigm with physical objects, building on preliminary\ndata collected in a human-only condition and extending the\ntask by introducing a robot arm to support performance\nduring task execution. The second and third experiments\ninvestigate working memory load through a sequential recall\ntask. The second experiment identifies neural markers of\nworking memory load, and the third introduces\nrobot-assisted offloading. Across all experiments, neural\nactivity (EEG), behavioral performance, and subjective\nworkload will be measured. By contrasting high- and\nlow-load conditions and comparing human-only and\nrobot-assisted performance, this work aims to inform the\ndesign of stage-specific robotic assistance tailored to\ndistinct cognitive demands."}]}}]}, {"start": "11:00", "end": "11:30", "tracks": [{"title": "Coffee break", "kind": "break"}]}, {"start": "11:30", "end": "13:00", "tracks": [{"title": "Awards (papers, ECR papers), Announcements, Greetings", "kind": "event"}]}, {"start": "13:00", "end": "14:00", "tracks": [{"title": "Lunch", "kind": "break"}]}]}, "reserve": [{"id": 30, "type": "long", "title": "Does Violent Video Gaming Induce Hostile Emotional Processing in Habitual Players? Evidence from Eye-Tracking Metrics", "authors": "Anantha Ubaradka and Sanjram Premjit Khanganba", "keywords": "Violent video games\nFacial emotion recognition\nAggression\nGeneral Aggression Model", "abstract": "The present study examined whether habitual interaction\nwith violent video games would result in biased emotional\ninformation processing among players. A total of 42 adult\nstudents, categorized as habitual violent video gamers\n(HVVGs; n = 21, Mage = 20.09 years, SD = 0.89) and\nnon-video gamers (NVGs; n = 21, Mage = 21.66 years, SD =\n2.01), took part in the study. Participants completed an\nemotional go/no-go task that required them to recognize\nfacial expressions of happiness, anger, disgust, fear, and\nsadness. Results indicated that HVVGs outperformed NVGs in\nthe emotion recognition task, demonstrating higher response\naccuracy and faster reaction times. Overall recognition\ncapacity was superior for happiness than for the negative\nemotions across the groups. Fixation metrics corroborated\nthis pattern. Participants showed shorter times to first\nfixation in the mouth region when recognizing happiness,\nalong with longer first and total fixation durations. This\nconsistent gaze pattern suggests greater perceptual\nsalience of happiness on a specified facial region,\ncontributing to its recognition advantage. In contrast,\nrecognition of negative emotions showed a scattered gaze\npattern, indicating weaker diagnostic cues in specific\nfacial regions, rather than reflecting an emotional\ndesensitization. Overall findings call into question the\nGeneral Aggression Model’s assertion that habitual violent\nvideo gaming promotes hostile emotional processing and\ncaution against attributing aggression primarily to violent\nvideo games in isolation. Instead, the findings emphasize\nthe importance of accounting for a wider constellation of\ndispositional and environmental factors when explaining\naggression in video gamers."}, {"id": 19, "type": "short", "title": "Early Neural Responses to Robot, Human, and Doll Faces: N170 and EPN Evidence", "authors": "Simone Grassini, Saryz Taha Mamsheli, Amanda Tunes Paulsen and Enrico Cipriani", "keywords": "social robots\nElectroecephalography\nFace perception\nUncanny valley\nEmotions", "abstract": "The increasing presence of social robots in everyday\ncontexts requires a clearer understanding of how humans\nrespond to anthropomorphic features such as facial\nstructure and emotional expression. In this EEG study, 28\nparticipants viewed images of humans, AI-generated humans,\nrobots, and dolls displaying happy, fearful, and neutral\nexpressions. Event-related potentials associated with face\nprocessing (N170), expectancy violation and uncanniness\n(N400), and emotionally driven attention (EPN) were\nexamined across conditions. Robot faces elicited the\nstrongest N170 responses, followed by dolls, humans, and\nAI-generated humans, indicating that non-human faces\nrequire greater neural processing during early face\nrecognition. A similar pattern emerged for the N400, with\nrobots producing the largest modulation, followed by dolls,\nAI-generated humans, and humans, consistent with increased\nuncanniness for more artificial agents. For the EPN,\nemotional expressions showed the expected pattern, with\nfearful faces eliciting the largest responses, followed by\nhappy and neutral expressions. In contrast, there was an\nunexpected pattern of humans producing the largest\nmodulation, followed by dolls and lastly robots and\nAI-generated humans having non-significant differences.\nThese findings indicate that robot faces are categorized as\nfaces at early processing stages but require more neural\nresources than human faces. The results further support the\nuse of N400 as an index of uncanniness, with robots\neliciting the strongest effect."}, {"id": 58, "type": "short", "title": "The Red Shoes 2", "authors": "Rachael E. Hollands, Mimi Porter, Jessica A. Eccles, Thanaporn Tunprasert and Harry Witchel", "keywords": "ambulation\nmotion capture\nwalking analysis\nred sneakers\ngreen trainers", "abstract": "In this work in progress, we elucidate further progress\nusing a low-tech and frugal design for offline tracking of\ngait on a treadmill using a single dorsally-situated GoPro\nvideo camera recording at 240 fps.  Our participants wore\nbrightly coloured athletic shoes (one red, one green) and\nthree LEDs on their back.  This method can derive a range\nof variability measures such as swing time asymmetry and\nstride time variability; these are typically unavailable\nwithout a costly gait lab work up.   This approach may aid\nin teasing apart subtle gait changes linked to joint\nhypermobility and its effects on gait."}]}
